          <p id="impErr" class="error">${esc(I.err || '')}</p>
          </div>
          <div class="btn-row"><button class="btn ghost" id="btnCancel">Peruuta</button><button class="btn" id="btnNext">Jatka</button></div>`;
      }
      if (I.step === 2) {
        const reg = registry();
        const all = Object.keys(reg).sort((a, b) => reg[a].name.localeCompare(reg[b].name, 'fi'));
        const nKnown = I.srcNames.filter(n => I.map[n].pid !== '__new').length;
        const howLabel = { alias: ['Aiempi kohdistus', 'win'], exact: ['Sama nimi', 'win'], fuzzy: ['Ehdotus – tarkista', 'warn'], ambiguous: ['Useita vaihtoehtoja', 'warn'] };
        return `${steps}<h2>Kohdista nimet</h2>
          <div class="card col">
            <div class="row wrap"><div style="flex:2;min-width:12em"><label class="label" for="impName">Tapahtuma</label><input id="impName" class="field" maxlength="60" placeholder="Tapahtuma ${esc(fmtDate(I.date))}" value="${esc(I.name)}"></div>
            <div style="flex:1;min-width:10em"><label class="label" for="impDate">Päivä</label><input id="impDate" class="field" type="date" value="${esc(I.date)}"></div></div>
          </div>
          <p class="small muted">${I.srcNames.length} nimeä: ${nKnown} kohdistettu rankingin pelaajiin, ${I.srcNames.length - nKnown} uutta. Valitse jokaiselle nimelle oikea pelaaja tai lisää uusi. Valinta muistetaan seuraavaa tuontia varten.</p>
          <div class="card">${I.srcNames.map((n, i) => { const m = I.map[n]; const hl = howLabel[m.how];
            const cand = (m.candidates || []).filter(p => reg[p]);
            return `<div class="map-row"><div class="map-src"><b>${esc(n)}</b> ${m.pid === '__new' ? '<span class="pill primary">Uusi</span>' : hl ? `<span class="pill ${hl[1]}">${hl[0]}</span>` : ''}</div>
              <select class="field" data-map="${i}" aria-label="Pelaaja nimelle ${esc(n)}">
                <option value="__new"${m.pid === '__new' ? ' selected' : ''}>+ Uusi pelaaja</option>
                ${cand.length ? `<optgroup label="Ehdotukset">${cand.map(p => `<option value="${esc(p)}"${m.pid === p ? ' selected' : ''}>${esc(reg[p].name)}</option>`).join('')}</optgroup>` : ''}
                <optgroup label="Kaikki pelaajat">${all.filter(p => !cand.includes(p)).map(p => `<option value="${esc(p)}"${m.pid === p ? ' selected' : ''}>${esc(reg[p].name)}</option>`).join('')}</optgroup>
              </select>
              ${m.pid === '__new' ? `<input class="field map-new" data-new="${i}" maxlength="40" value="${esc(m.newName)}" placeholder="Nimi rankingissa, esim. Jukka Holopainen" aria-label="Uuden pelaajan nimi">` : ''}</div>`; }).join('')}</div>
          <p id="impErr" class="error">${esc(I.err || '')}</p>
          <div class="btn-row"><button class="btn ghost" id="btnBack">Takaisin</button><button class="btn" id="btnNext">Esikatsele</button></div>`;
      }
      // Vaihe 3: esikatselu
      const pv = I.preview;
      const latest = S.comp.imports.length ? S.comp.imports[S.comp.imports.length - 1].date : null;
      const hasRanked = Object.keys(S.comp.players).length > 0;
      return `${steps}<h2>Esikatselu</h2>
        <p class="small muted"><b>${esc(I.built.imp.name)}</b> · ${fmtDate(I.date)} · ${pv.rows.length} pelaajaa, joista ${pv.res.ranked} rankattuja ja ${pv.res.fresh} uutta${pv.games ? ` · ${pv.games} erää` : ''}</p>
        ${hasRanked && pv.res.ranked === 0 ? '<div class="banner warn">Tapahtumassa ei ole yhtään rankattua pelaajaa, joten sitä ei voi suhteuttaa muihin. Uusien pelaajien tasot ovat suhteessa vain tämän tapahtuman pelaajiin. Harkitse erillistä rankingia.</div>' : ''}
        ${pv.res.ranked === 1 ? '<div class="banner warn">Tapahtumassa on vain yksi rankattu pelaaja, joten uusien pelaajien suhteutus on epävarma.</div>' : ''}
        ${latest && I.date < latest ? '<div class="banner info">Tapahtuma on vanhempi kuin uusin tuonti. Ranking lasketaan uudelleen päivämääräjärjestyksessä, joten myöhempien tapahtumien muutokset voivat päivittyä.</div>' : ''}
        <div class="card"><table class="tbl"><thead><tr><th>Pelaaja</th><th class="num">Ennen</th><th class="num">Jälkeen</th><th class="num">Muutos</th></tr></thead><tbody>
          ${pv.rows.map(r => `<tr><td><b>${esc(r.name)}</b>${r.src !== r.name ? `<div class="tiny muted">${esc(r.src)}</div>` : ''}</td><td class="num">${r.before === undefined ? '–' : rkLabel(r.before)}</td><td class="num"><b>${rkLabel(r.after)}</b></td><td class="num">${changeHtml(r.before === undefined ? null : rkLabel(r.after) - rkLabel(r.before))}</td></tr>`).join('')}
        </tbody></table></div>
        <p id="impErr" class="error">${esc(I.err || '')}</p>
        <div class="btn-row"><button class="btn ghost" id="btnBack">Takaisin</button><button class="btn" id="btnSave">Tallenna rankingiin</button></div>`;
    }

    function mountImport() {
      const I = S.imp;
      const cancel = $('btnCancel'); if (cancel) cancel.onclick = () => { S.imp = null; render(); };
      const back = $('btnBack'); if (back) back.onclick = () => { readStep2Inputs(); I.step--; I.err = ''; render(); };
      if (I.step === 1) {
        document.querySelectorAll('[data-src]').forEach(b => b.onclick = () => { readStep1Inputs(); I.source = b.dataset.src; I.err = ''; render(); });
        document.querySelectorAll('[data-scale]').forEach(b => b.onclick = () => { readStep1Inputs(); I.scale = b.dataset.scale; render(); });
        const f = $('impFile');
        if (f) f.onchange = () => { const file = f.files[0]; if (!file) return; const rd = new FileReader(); rd.onload = () => { I.text = String(rd.result || ''); render(); }; rd.readAsText(file); };
        $('btnNext').onclick = async () => {
          readStep1Inputs();
          $('btnNext').disabled = true;
          try { await parseStep1(); I.step = 2; I.err = ''; } catch (e) { I.err = errMsg(e); }
          render();
        };
        const kc = $('kisaCode'); if (kc) kc.onkeydown = e => { if (e.key === 'Enter') $('btnNext').click(); };
      } else if (I.step === 2) {
        document.querySelectorAll('[data-map]').forEach(sel => sel.onchange = () => {
          readStep2Inputs();
          const n = I.srcNames[+sel.dataset.map];
          I.map[n].pid = sel.value;
          render();
        });
        $('btnNext').onclick = () => {
          readStep2Inputs();
          try { buildPreview(); I.step = 3; I.err = ''; } catch (e) { I.err = errMsg(e); }
          render(); $('main').scrollTop = 0;
        };
      } else {
        $('btnSave').onclick = async () => {
          $('btnSave').disabled = true;
          try { await saveImport(); S.imp = null; S.tab = 'table'; toast('Tapahtuma tuotu rankingiin'); }
          catch (e) { I.err = errMsg(e); }
          render();
        };
      }
    }
    function readStep1Inputs() {
      const I = S.imp;
      const kc = $('kisaCode'); if (kc) I.code = normCode(kc.value);
      const tx = $('impText'); if (tx) I.text = tx.value;
    }
    function readStep2Inputs() {
      const I = S.imp;
      const nm = $('impName'); if (nm) I.name = nm.value.trim();
      const dt = $('impDate'); if (dt) I.date = dt.value;
      document.querySelectorAll('[data-new]').forEach(inp => { I.map[I.srcNames[+inp.dataset.new]].newName = inp.value.trim(); });
    }

    async function parseStep1() {
      const I = S.imp;
      let names = [];
      I.games = null; I.levels = null; I.places = null; I.starts = null;
      if (I.source === 'kisa') {
        if (!/^[A-Z0-9]{3,20}$/.test(I.code)) throw new Error('Anna Kisa-tapahtuman pelaajakoodi.');
        const dup = S.comp.imports.find(i => i.source === 'kisa' && i.sourceRef === I.code);
        if (dup) throw new Error(`Tämä tapahtuma on jo tuotu ("${dup.name}", ${fmtDate(dup.date)}). Poista vanha tuonti ensin, jos haluat tuoda sen uudelleen.`);
        const ev = await db(() => backend.get('events/' + I.code));
        if (!ev) throw new Error('Koodilla ei löytynyt Kisa-tapahtumaa. Käytä pelaajakoodia (ei järjestäjäkoodia).');
        const k = rkFromKisaEvent(ev);
        if (!k.games.length) throw new Error('Tapahtumassa ei ole vielä tuloksia.');
        I.games = k.games; I.starts = k.starts;
        if (!I.name) I.name = k.name;
        if (!I.date) I.date = k.date;
        k.games.forEach(g => g.t1.concat(g.t2).forEach(n => { if (!names.includes(n)) names.push(n); }));
      } else if (I.source === 'games') {
        const r = rkParseGames(I.text);
        if (r.errors.length) throw new Error(r.errors.slice(0, 5).join('\n'));
        if (!r.games.length) throw new Error('Liitä erätulokset tekstikenttään.');
        I.games = r.games;
        r.games.forEach(g => g.t1.concat(g.t2).forEach(n => { if (!names.some(x => rkNorm(x) === rkNorm(n))) names.push(n); }));
        // Sama nimi eri kirjoitusasulla samassa tuonnissa = sama pelaaja
        const canon = {}; names.forEach(n => { canon[rkNorm(n)] = n; });
        I.games = r.games.map(g => ({ t1: g.t1.map(n => canon[rkNorm(n)]), t2: g.t2.map(n => canon[rkNorm(n)]), a: g.a, b: g.b }));
      } else if (I.source === 'levels') {
        const r = rkParseLevels(I.text);
        if (r.errors.length) throw new Error(r.errors.slice(0, 5).join('\n'));
        if (r.levels.length < 2) throw new Error('Tarvitaan vähintään kaksi pelaajaa.');
        I.levels = {}; r.levels.forEach(l => { I.levels[l.name] = l.value; names.push(l.name); });
      } else {
        const r = rkParsePlacement(I.text);
        if (r.errors.length) throw new Error(r.errors.slice(0, 5).join('\n'));
        if (r.places.length < 2) throw new Error('Tarvitaan vähintään kaksi pelaajaa.');
        I.places = {}; r.places.forEach(p => { I.places[p.name] = p.place; names.push(p.name); });
      }
      const bad = names.map(rkNameError).find(Boolean);
      if (bad) throw new Error(bad);
      if (!I.date) I.date = today();
      const reg = registry(), aliases = (S.data && S.data.aliases) || {};
      const oldMap = I.map || {};
      I.srcNames = names;
      I.map = {};
      names.forEach(n => {
        const sug = rkSuggest(n, reg, aliases);
        I.map[n] = oldMap[n] || { pid: sug.pid || '__new', newName: n, how: sug.how, candidates: sug.candidates };
      });
      I.newIds = I.newIds || {};
    }

    function buildImport() {
      const I = S.imp;
      const reg = registry();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(I.date || '')) throw new Error('Anna tapahtuman päivä.');
      const used = {}, newNames = {};
      for (const n of I.srcNames) {
        const m = I.map[n];
        if (m.pid === '__new') {
          const er = rkNameError(m.newName); if (er) throw new Error(er);
          const key = rkNorm(m.newName);
          const clash = Object.keys(reg).find(p => rkNorm(reg[p].name) === key);
          if (clash) throw new Error(`"${m.newName}" on jo rankingissa. Valitse hänet listasta nimelle "${n}".`);
          if (newNames[key]) throw new Error(`Uusi nimi "${m.newName}" on annettu kahdelle eri nimelle (${newNames[key]} ja ${n}).`);
          newNames[key] = n;
          if (!I.newIds[n]) I.newIds[n] = newId('p');
        } else {
          if (!reg[m.pid]) throw new Error(`Valitse pelaaja nimelle "${n}".`);
          if (used[m.pid]) throw new Error(`${reg[m.pid].name} on valittu kahdelle nimelle: ${used[m.pid]} ja ${n}.`);
          used[m.pid] = n;
        }
      }
      const pidOf = n => I.map[n].pid === '__new' ? I.newIds[n] : I.map[n].pid;
      const imp = { name: (I.name || `Tapahtuma ${fmtDate(I.date)}`).slice(0, 60), date: I.date, source: I.source, importedAt: new Date().toISOString(), names: {} };
      I.srcNames.forEach(n => { imp.names[pidOf(n)] = n; });
      if (I.games) imp.games = I.games.map(g => ({ t1: g.t1.map(pidOf), t2: g.t2.map(pidOf), a: g.a, b: g.b }));
      if (I.source === 'kisa') {
        imp.sourceRef = I.code;
        imp.starts = {};
        Object.keys(I.starts || {}).forEach(n => { if (I.map[n]) imp.starts[pidOf(n)] = I.starts[n]; });
      }
      if (I.levels) { imp.levels = {}; Object.keys(I.levels).forEach(n => { imp.levels[pidOf(n)] = I.levels[n]; }); imp.scale = I.scale; }
      if (I.places) { imp.places = {}; Object.keys(I.places).forEach(n => { imp.places[pidOf(n)] = I.places[n]; }); }
      const newPlayers = {};
      I.srcNames.forEach(n => { if (I.map[n].pid === '__new') newPlayers[I.newIds[n]] = { name: I.map[n].newName, createdAt: new Date().toISOString() }; });
      return { imp, newPlayers, pidOf };
    }
    function buildPreview() {
      const I = S.imp;
      const { imp, newPlayers, pidOf } = buildImport();
      const tmpId = '__preview';
      const temp = Object.assign({}, S.data, { players: Object.assign({}, registry(), newPlayers), imports: Object.assign({}, S.data.imports || {}, { [tmpId]: imp }) });
      const comp = rkCompute(temp);
      const res = comp.results[tmpId];
      const rows = I.srcNames.map(n => { const p = pidOf(n); return { src: n, name: temp.players[p].name, before: res.before[p], after: res.after[p] }; }).sort((a, b) => b.after - a.after);
      I.preview = { res, rows, games: imp.games ? imp.games.length : 0 };
      I.built = { imp, newPlayers, pidOf };
    }
    async function saveImport() {
      const I = S.imp;
      const { imp, newPlayers, pidOf } = buildImport();
      if (I.source === 'kisa' && S.comp.imports.some(i => i.source === 'kisa' && i.sourceRef === I.code)) throw new Error('Tämä tapahtuma on jo tuotu.');
      const iid = newId('i');
      const updates = { ['imports/' + iid]: imp };
      Object.entries(newPlayers).forEach(([p, v]) => { updates['players/' + p] = v; });
      I.srcNames.forEach(n => { updates['aliases/' + rkAliasKey(n)] = pidOf(n); });
      await writeRanking(updates);
    }

    // ---------- Käynnistys ----------
    backend.onConnection(ok => { const c = $('connBadge'); c.classList.toggle('off', !ok); c.setAttribute('aria-label', ok ? 'Yhteys kunnossa' : 'Ei yhteyttä'); });
    (async function init() {
      try { await backend.ensureAuth(); } catch (e) { toast('Kirjautuminen epäonnistui: ' + errMsg(e), 'error'); }
      const adminCode = normCode(URL_PARAMS.get('admin'));
      const rid = normCode(URL_PARAMS.get('r'));
      if (adminCode) {
        try { const r = await db(() => backend.get('rankingCodes/' + adminCode)); if (!r) throw new Error('Ylläpitäjäkoodilla ei löytynyt rankingia.'); await openRanking(r, adminCode); return; }
        catch (e) { toast(errMsg(e), 'error'); }
      }
      if (rid) { await openRanking(rid); return; }
      render();
    })();
  </script>
</body>
</html>
