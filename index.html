    function openSheet(o) {
      const wrap = document.createElement('div');
      wrap.className = 'sheet-wrap';
      wrap.innerHTML = `<div class="sheet${o.full ? ' full' : ''}" role="dialog" aria-modal="true">
        <div class="sheet-handle"></div>
        <div class="sheet-head"><h2></h2><button class="icon-btn" type="button" aria-label="Sulje">${icon('close')}</button></div>
        <div class="sheet-body"></div><div class="sheet-foot"></div></div>`;
      const s = {
        el: wrap, o, state: o.state || {},
        body: wrap.querySelector('.sheet-body'), foot: wrap.querySelector('.sheet-foot'),
        setTitle(t) { wrap.querySelector('h2').textContent = t; },
        refresh() {
          const fs = captureFocus(s.body);
          s.body.innerHTML = ''; s.foot.innerHTML = '';
          if (o.title) s.setTitle(typeof o.title === 'function' ? o.title(s) : o.title);
          o.render(s);
          s.foot.classList.toggle('hidden', !s.foot.childNodes.length);
          restoreFocus(s.body, fs);
        },
        close(v) {
          const i = sheets.indexOf(s);
          if (i >= 0) sheets.splice(i, 1);
          wrap.remove();
          if (o.onClose) o.onClose(v);
        }
      };
      wrap.querySelector('.sheet-head .icon-btn').onclick = () => s.close();
      if (o.noClose) wrap.querySelector('.sheet-head .icon-btn').classList.add('hidden');
      wrap.addEventListener('click', (e) => { if (e.target === wrap && !o.noClose) s.close(); });
      // Pyyhkäisy alas sulkee
      const handle = wrap.querySelector('.sheet-handle'), panel = wrap.querySelector('.sheet');
      handle.addEventListener('pointerdown', (e) => {
        if (o.noClose) return;
        const y0 = e.clientY; let dy = 0;
        panel.style.transition = 'none';
        const move = (ev) => { dy = Math.max(0, ev.clientY - y0); panel.style.transform = `translateY(${dy}px)`; };
        const up = () => {
          document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
          panel.style.transition = ''; panel.style.transform = '';
          if (dy > 80) s.close();
        };
        document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
      });
      $('sheetHost').appendChild(wrap);
      sheets.push(s);
      s.refresh();
      return s;
    }

      const ids = tabsForRole().map(t => t[0]);
      if (!ids.includes(tab)) tab = defaultTab();
      if (activeTab !== tab && tab === 'players') pm = null;
      activeTab = tab;
      eventMode = 'tabs';
      lastRenderSig = null;
      renderEventView();
    }

    function renderNav() {
      const nav = $('bottomNav');
      if (!currentEventData || currentView !== 'view-event' || tvMode || eventMode !== 'tabs') {
        nav.classList.add('hidden');
        return;
      }
      const st = computeRoundStatus(currentEventData);
      nav.innerHTML = tabsForRole().map(([id, ic, label]) => {
        const active = activeTab === id;
        const badge = (id === 'round' && st.completed) ? '<span class="badge">!</span>' : '';
        return `<button type="button" class="nav-item${active ? ' active' : ''}" data-nav="${id}" aria-label="${label}"${active ? ' aria-current="page"' : ''}>${icon(ic)}<span>${label}</span>${badge}</button>`;
      }).join('');
      nav.querySelectorAll('[data-nav]').forEach(b => { b.onclick = () => switchTab(b.dataset.nav); });
      nav.classList.remove('hidden');
    }

    // ---------- Fokuksen säilytys uudelleenpiirrossa ----------
    function captureFocus(container) {
      const act = document.activeElement;
      if (act && act.dataset && act.dataset.draft && container.contains(act)) {
        let s = null, e = null;
        try { s = act.selectionStart; e = act.selectionEnd; } catch (_) {}
        return { key: act.dataset.draft, s, e };
      }
      return null;
    }
    function restoreFocus(container, st) {
      if (!st) return;
      const inp = Array.from(container.querySelectorAll('input[data-draft]')).find(i => i.dataset.draft === st.key);
      if (!inp) return;
      inp.focus();
      try { if (st.s != null) inp.setSelectionRange(st.s, st.e); } catch (_) {}
    }

    // ============================================================
    // TIETOKANTAOPERAATIOT
    // ============================================================
    async function createEvent(name, playerNames, opts = {}) {
      const uid = backend.uid() || await backend.ensureAuth();
      let playerCode;
      for (let i = 0; i < 10; i++) {
        const candidate = generateId();
        const [ev, oc] = await Promise.all([
          withAuthRetry(() => backend.get('events/' + candidate)),
          withAuthRetry(() => backend.get('organizerCodes/' + candidate))
        ]);
        if (!ev && !oc) { playerCode = candidate; break; }
      }
      if (!playerCode) throw new Error('Koodin luonti epäonnistui.');
      let organizerCode;
      for (let i = 0; i < 10; i++) {
        const candidate = generateId();
        if (candidate === playerCode) continue;
        const [ev, oc] = await Promise.all([
          withAuthRetry(() => backend.get('events/' + candidate)),
          withAuthRetry(() => backend.get('organizerCodes/' + candidate))
        ]);
        if (!ev && !oc) { organizerCode = candidate; break; }
      }
      if (!organizerCode) throw new Error('Järjestäjäkoodin luonti epäonnistui.');
      const courts = computeInitialCourts(playerNames);
      const eventData = {
        playerCode, name, playerNames, courts,
        seedOrder: [...playerNames], useSeedPrior: opts.useSeedPrior !== false, seedByCourt: true,
        rounds: [{ roundIndex: 0, results: {} }, { roundIndex: 1, results: {} }, { roundIndex: 2, results: {} }],
        previousCycles: [], restCounts: {}, lastRestCycle: {}, status: 'active', createdAt: new Date().toISOString()
      };
      // Yksi atominen päivitys: tapahtuma, koodit ja järjestäjän oikeus
      await withAuthRetry(() => backend.update('', {
        ['events/' + playerCode]: eventData,
        ['organizerCodes/' + organizerCode]: playerCode,
        ['organizerSecret/' + playerCode]: organizerCode,
        [`organizerClaims/${playerCode}/${uid}`]: organizerCode
      }), { write: true });
      return { playerCode, organizerCode };
    }

    async function claimOrganizer(eventId, code) {
      const uid = backend.uid() || await backend.ensureAuth();
      try {
        await withAuthRetry(() => backend.set(`organizerClaims/${eventId}/${uid}`, code), { write: true });
      } catch (e) {
        if (isPermissionError(e)) throw new Error('Järjestäjäkoodi ei kelvannut.');
        throw e;
      }
    }

    async function loadEvent(eventId) {
      return await withAuthRetry(() => backend.get('events/' + eventId));
    }

    function listenEvent(eventId, callback) {
      if (unsubscribeEvent) { unsubscribeEvent(); unsubscribeEvent = null; }
      unsubscribeEvent = backend.listen('events/' + eventId, callback, (error) => {
        console.error('Tietokannan kuunteluvirhe:', error);
        if (isPermissionError(error)) backend.reauth().catch(e => console.error('Re-auth epäonnistui', e));
      });
    }

    function onEventData(d) {
      if (!d) {
        if (deletingNow) return;
        notify('Tapahtuma on poistettu.');
        removeRecentEvent(currentEventId);
        leaveEvent();
        return;
      }
      currentEventData = d;
      if (currentPlayerName && !(d.playerNames || []).includes(currentPlayerName)) {
        // Järjestäjä on voinut vaihtaa nimen: seurataan uuteen nimeen
        const renamed = resolveRenamedPlayer(d, currentPlayerName);
        if (renamed) showToast(`Nimesi on nyt ${renamed}`);
        currentPlayerName = renamed;
        const e = getEventEntry(currentEventId);
        if (e) upsertRecentEvent({ ...e, myPlayerName: renamed });
      }
      renderEventView();
      refreshLiveSheets();
    }

    async function loadOrganizerSecret(eventId) {
      try {
        const v = await withAuthRetry(() => backend.get('organizerSecret/' + eventId));
        if (v) currentOrganizerCode = v;
        else if (currentEventData && currentEventData.organizerCode) currentOrganizerCode = currentEventData.organizerCode; // vanha tapahtumamalli
        if (currentOrganizerCode) {
          const entry = getEventEntry(eventId);
          if (entry && entry.organizerCode !== currentOrganizerCode) upsertRecentEvent({ ...entry, organizerCode: currentOrganizerCode });
        }
      } catch (e) {
        if (!currentOrganizerCode && currentEventData && currentEventData.organizerCode) currentOrganizerCode = currentEventData.organizerCode;
      }
      lastRenderSig = null;
      if (activeTab === 'admin') renderEventView();
    }

    async function deleteEvent() {
      if (!currentEventId || !currentEventData) return;
      const name = currentEventData.name || currentEventId;
      if (!(await askConfirm(`Poistetaanko tapahtuma "${name}" pysyvästi?\n\nTämä poistaa tapahtuman tietokannasta ja kaikilta laitteilta. Toimintoa EI voi perua.`, { ok: 'Poista pysyvästi', danger: true, title: 'Poista tapahtuma' }))) return;
      showLoading('Poistetaan tapahtumaa...');
      deletingNow = true;
      try {
        const playerCode = currentEventData.playerCode || currentEventId;
        let organizerCode = currentOrganizerCode || currentEventData.organizerCode || null;
        if (!organizerCode) { try { organizerCode = await withAuthRetry(() => backend.get('organizerSecret/' + playerCode)); } catch (e) {} }
        const uid = backend.uid() || await backend.ensureAuth();
        const updates = {
          ['events/' + playerCode]: null,
          ['organizerSecret/' + playerCode]: null,
          [`organizerClaims/${playerCode}/${uid}`]: null
        };
        if (organizerCode) updates['organizerCodes/' + organizerCode] = null;
        await withAuthRetry(() => backend.update('', updates), { write: true });
        removeRecentEvent(playerCode);
        hideLoading();
        leaveEvent();
        showToast('Tapahtuma poistettu');
      } catch (e) {
        hideLoading();
        notify('Virhe poistossa: ' + e.message);
      } finally {
        deletingNow = false;
      }
    }

    // Palauttaa {eventId,eventData,role} tai null. Verkkovirheet heitetään ylöspäin.
    async function resolveEventCode(code) {
      if (!isValidCodeFormat(code)) return null;
      let firstErr = null;
      try {
        const v = await withAuthRetry(() => backend.get('events/' + code));
        if (v) return { eventId: code, eventData: v, role: 'player' };
      } catch (e) { firstErr = e; }
      try {
        const pc = await withAuthRetry(() => backend.get('organizerCodes/' + code));
        if (pc) {
          const v = await withAuthRetry(() => backend.get('events/' + pc));
          if (v) return { eventId: pc, eventData: v, role: 'organizer' };
        }
      } catch (e) { firstErr = firstErr || e; }
      if (firstErr && !isPermissionError(firstErr)) throw firstErr;
      return null;
    }

    async function joinWithCode(raw, errEl) {
      const code = normalizeCode(raw);
      const fail = (m) => { if (errEl) errEl.textContent = m; else notify(m); };
      if (errEl) errEl.textContent = '';
      if (!code) return fail('Anna pelaaja- tai järjestäjäkoodi.');
      showLoading('Liitytään...');
      try {
        const res = await resolveEventCode(code);
        if (!res) { hideLoading(); return fail('Koodia ei löytynyt. Tarkista kirjoitusasu.'); }
        if (res.role === 'organizer') await claimOrganizer(res.eventId, code);
        const entry = getEventEntry(res.eventId);
        resetEventState();
        currentRole = res.role;
        currentPlayerName = (entry && entry.myPlayerName) || null;
        currentOrganizerCode = res.role === 'organizer' ? code : null;
        await enterEvent(res.eventId, res.eventData);
        if (res.role === 'organizer') showToast('Avattu järjestäjänä');
        if (!currentPlayerName) askIdentify();
      } catch (e) { hideLoading(); fail('Virhe: ' + e.message); }
    }

    async function createAndEnter(name, names, selfName, opts = {}) {
      const { playerCode, organizerCode } = await createEvent(name, names, opts);
      currentEventId = playerCode; currentRole = 'organizer'; currentPlayerName = selfName; currentOrganizerCode = organizerCode;

      upsertRecentEvent({ id: playerCode, name, role: 'organizer', myPlayerName: selfName, playerCount: names.length, organizerCode });
      history.replaceState({}, '', window.location.pathname + '?event=' + playerCode + (LOCAL_MODE && URL_PARAMS.get('local') === '1' ? '&local=1' : ''));

              <button class="code-box" type="button" id="ccP"><div class="label">Pelaajakoodi</div><div class="cv">${esc(playerCode)}</div><div class="tiny muted">Napauta kopioidaksesi</div></button>

    // ============================================================
    // TAPAHTUMAAN SIIRTYMINEN JA NIMEN VALINTA
    // ============================================================
    async function openEvent(eventId) {
      showLoading('Avataan tapahtumaa...');
      try {
        const data = await loadEvent(eventId);
        if (!data) {
          hideLoading();
          if (await askConfirm('Tapahtumaa ei löytynyt (se on voitu poistaa). Poistetaanko se listalta?', { ok: 'Poista listalta', danger: true })) { removeRecentEvent(eventId); renderHome(); }
          return;
        }
        const entry = getEventEntry(eventId);
        resetEventState();
        currentRole = (entry && entry.role) || 'player';
        currentPlayerName = (entry && entry.myPlayerName) || null;
        currentOrganizerCode = (entry && entry.organizerCode) || null;
        await enterEvent(eventId, data);
        if (!currentPlayerName && currentRole !== 'organizer') askIdentify();
      } catch (e) { hideLoading(); notify('Virhe: ' + e.message); }
    }

    async function enterEvent(eventId, preloaded) {
      currentEventId = eventId;
      try {
        const data = preloaded || await loadEvent(eventId);
        if (!data) { hideLoading(); notify('Tapahtumaa ei löytynyt.'); return; }
        currentEventData = data;
        lastCycleCount = (data.previousCycles || []).length;
        editingRounds.clear(); scoreDrafts.clear();
        upsertRecentEvent({ id: eventId, name: data.name || eventId, role: currentRole, myPlayerName: currentPlayerName, playerCount: (data.playerNames || []).length });
        const want = '?event=' + eventId + (LOCAL_MODE && URL_PARAMS.get('local') === '1' ? '&local=1' : '');
        if (window.location.search !== want) history.replaceState({}, '', window.location.pathname + want);
        hideLoading();
        activeTab = defaultTab();
        eventMode = 'tabs';
        showView('view-event');
        renderEventView();
        requestWake();
        if (currentRole === 'organizer') loadOrganizerSecret(eventId);
        listenEvent(eventId, onEventData);
      } catch (e) { hideLoading(); notify('Virhe: ' + e.message); }
    }

    function askIdentify() {
      const d = currentEventData;
      if (!d) return;
      openSheet({
        title: 'Kuka olet?',
        full: (d.playerNames || []).length > 16,
        render(s) {
          s.body.appendChild(el('div', 'muted small', 'Napauta nimeäsi, niin näet oman pelisi ja voit syöttää tulokset.'));
          const seen = new Set();
          const group = (label, names) => {
            s.body.appendChild(el('div', 'group-label', esc(label)));
            const g = el('div', 'name-grid');
            names.forEach(n => {
              const b = el('button', 'name-btn' + (n === currentPlayerName ? ' on' : ''));
              b.type = 'button'; b.textContent = n;
              b.onclick = () => { s.close(); pickIdentity(n); };
              g.appendChild(b); seen.add(n);
            });
            s.body.appendChild(g);
          };
          (d.courts || []).forEach(c => group(`Kenttä ${c.courtNumber}`, c.players || []));
          const rest = (d.playerNames || []).filter(n => !seen.has(n));
          if (rest.length) group('Muut', rest);
          if (currentRole === 'organizer') {
            s.foot.appendChild(btn(currentPlayerName ? 'En pelaa itse' : 'Ohita – en pelaa', 'ghost', () => { s.close(); pickIdentity(null); }));
          }
        }
      });
    }

    function pickIdentity(name) {
      currentPlayerName = name;
      playSel = { key: null, view: null, manual: false };
      standCourt = null;
      const entry = getEventEntry(currentEventId);
      if (entry) upsertRecentEvent({ ...entry, myPlayerName: name });
      if (name) switchTab('play'); else switchTab(defaultTab());
    }

    // ============================================================
    // TAPAHTUMANÄKYMÄ
    // ============================================================
    function myCourt(d) { return currentPlayerName ? (d.courts || []).find(c => (c.players || []).includes(currentPlayerName)) || null : null; }
    function courtResults(d, court) { return [0, 1, 2].map(r => getCourtResult(d, r, court.courtIndex)); }
    function cycleNo(d) { return (d.previousCycles || []).length + 1; }

    function renderEventView() {
      if (!currentEventData || currentView !== 'view-event') return;
      if (pmDrag && pmDrag.active) { pmDrag.pending = true; return; }
      const d = currentEventData;
      const cycleCount = (d.previousCycles || []).length;
      if (cycleCount !== lastCycleCount) {
        lastCycleCount = cycleCount;
        editingRounds.clear(); scoreDrafts.clear();
        playSel = { key: null, view: null, manual: false };
      }
      const st = computeRoundStatus(d);
      const sub = st.completed
        ? `Kierros ${cycleCount + 1} valmis · ${st.totalEntered}/${st.total}`
        : (isCompact() ? `Kierros ${cycleCount + 1} · E${st.currentRound}/3 · ${st.totalEntered}/${st.total}` : `Kierros ${cycleCount + 1} · Erä ${st.currentRound}/3 · ${st.totalEntered}/${st.total} tulosta`);
      setTopbar(d.name || d.playerCode || 'Tapahtuma', sub, st.total ? Math.round(100 * st.totalEntered / st.total) : 0);
      $('btnShareTop').classList.remove('hidden');
      $('btnBack').classList.toggle('hidden', eventMode === 'tabs');

      const ids = tabsForRole().map(t => t[0]);
      if (!ids.includes(activeTab)) activeTab = defaultTab();

      const v = $('view-event');
      const sig = JSON.stringify([d, activeTab, eventMode, currentPlayerName, currentRole, playSel, standView, standCourt, pm, [...editingRounds], pageState, currentOrganizerCode, window.innerHeight, window.innerWidth, updateCompact()]);
      renderNav();
      if (sig === lastRenderSig) return;
      lastRenderSig = sig;
      const fs = captureFocus(v);
      v.innerHTML = '';
      if (eventMode === 'moves') renderMoves(v);
      else if (activeTab === 'play') renderPlay(v);
      else if (activeTab === 'courts') renderCourts(v, false);
      else if (activeTab === 'round') renderCourts(v, true);
      else if (activeTab === 'standings') renderStandings(v);
      else if (activeTab === 'me') renderMe(v);
      else if (activeTab === 'players') renderPlayers(v);
      else if (activeTab === 'admin') renderAdmin(v);
      restoreFocus(v, fs);
    }

    // ---------- Tuloksen syöttö ----------
    function teamNames(team) { return (team || []).map(esc).join(' &amp; '); }

    function teamEditor(team, mine, k, v, tag) {
      return `<div class="team${mine ? ' mine' : ''}">
        <div class="t-names">${tag ? `<span class="t-tag">${tag}</span>` : ''}${(team || []).map(p => `<b>${esc(p)}</b>`).join('')}</div>
        <div class="stepper">
          <button type="button" class="step" data-step="-1" aria-label="Vähennä pistettä">${icon('minus')}</button>
          <input class="score-in" type="number" min="0" max="99" inputmode="numeric" placeholder="–" value="${esc(v)}" data-draft="${k}" aria-label="Pisteet: ${esc((team || []).join(' ja '))}">
          <button type="button" class="step" data-step="1" aria-label="Lisää piste">${icon('plus')}</button>
        </div>
      </div>`;
    }
    function teamResult(team, mine, score, won, tag) {
      return `<div class="team${mine ? ' mine' : ''}${won ? ' won' : ''}">
        <div class="t-names">${tag ? `<span class="t-tag">${tag}</span>` : ''}${(team || []).map(p => `<b>${esc(p)}</b>`).join('')}</div>
        <div class="t-score">${esc(score)}</div>
      </div>`;
    }

    // Rakentaa syöttölomakkeen: palauttaa {node, focusFirst}
    function buildScoreEditor(court, r, opts = {}) {
      const d = currentEventData;
      const cycle = (d.previousCycles || []).length;
      const pair = getRoundPairing(court, r);
      const res = getCourtResult(d, r, court.courtIndex);
      const key = `${cycle}-${court.courtIndex}-${r}`;
      const k1 = `c-${key}-1`, k2 = `c-${key}-2`;
      const v1 = scoreDrafts.has(k1) ? scoreDrafts.get(k1) : (res ? res.team1Score : '');
      const v2 = scoreDrafts.has(k2) ? scoreDrafts.get(k2) : (res ? res.team2Score : '');
      const me1 = !!currentPlayerName && pair.team1.includes(currentPlayerName);
      const me2 = !!currentPlayerName && pair.team2.includes(currentPlayerName);
      const wrap = el('div', 'match score-entry');
      wrap.dataset.court = court.courtIndex; wrap.dataset.round = r;
      const tag = isCompact() ? 'Sinä' : 'Sinun joukkueesi';
      wrap.innerHTML = `${teamEditor(pair.team1, me1, k1, v1, me1 ? tag : '')}
        <div class="vs">VASTAAN</div>
        ${teamEditor(pair.team2, me2, k2, v2, me2 ? tag : '')}`;
      wrap.querySelectorAll('.step').forEach(b => {
        b.onclick = () => {
          const inp = b.parentNode.querySelector('input');
          const cur = parseInt(inp.value);
          const nv = Math.max(0, Math.min(99, (isNaN(cur) ? 0 : cur) + parseInt(b.dataset.step)));
          inp.value = String(nv);
          inp.dispatchEvent(new Event('input', { bubbles: true }));
        };
      });
      return wrap;
    }

    function updateSaveState(input) {
      const host = input.closest && input.closest('[data-score-host]');
      if (!host) return;
      const ins = host.querySelectorAll('input[data-draft]');
      if (ins.length < 2) return;
      const a = ins[0].value, b = ins[1].value;
      const lbl = host.querySelector('.save-label'), button = host.querySelector('.score-submit'), hint = host.querySelector('.hint');
      const filled = a !== '' && b !== '';
      if (lbl) lbl.textContent = filled ? `${lbl.dataset.base} ${a}–${b}` : lbl.dataset.base;
      if (button && !button.dataset.busy) button.disabled = !filled;
      if (hint) { hint.className = 'hint'; hint.textContent = filled && a === b ? 'Tasapeli: kumpikin joukkue saa puoli voittoa.' : (hint.dataset.base || ''); }
    }

    // Tallennuspainike + vihje syöttölomakkeelle. onDone kutsutaan onnistuneen tallennuksen jälkeen.
    function buildSaveBar(host, court, r, isEdit, onDone, onCancel) {
      const d = currentEventData;
      const cycle = (d.previousCycles || []).length;
      host.dataset.scoreHost = '1';
      const hint = el('p', 'hint');
      hint.dataset.base = '';
      const bar = el('div', 'col');
      bar.style.flex = '0 0 auto';
      bar.style.gap = '8px';
      const base = isEdit ? 'Tallenna muutos' : 'Tallenna tulos';
      const save = el('button', 'btn big score-submit', `${icon('check')}<span class="save-label" data-base="${base}">${base}</span>`);
      save.type = 'button';
      if (onCancel) {
        const row = el('div', 'btn-row');
        const c = btn('Peruuta', 'ghost', onCancel);
        c.style.flex = '0 0 34%';
        row.appendChild(c); row.appendChild(save);
        bar.appendChild(row);
      } else bar.appendChild(save);
      save.onclick = async () => {
        const ins = host.querySelectorAll('input[data-draft]');
        const s1 = parseInt(ins[0].value), s2 = parseInt(ins[1].value);
        if (isNaN(s1) || isNaN(s2) || s1 < 0 || s2 < 0 || s1 > 99 || s2 > 99) { hint.className = 'hint err'; hint.textContent = 'Syötä molempien joukkueiden pisteet (0–99).'; return; }
        const prev = getCourtResult(currentEventData, r, court.courtIndex);
        const lbl = save.querySelector('.save-label');
        save.disabled = true; save.dataset.busy = '1'; lbl.textContent = 'Tallennetaan...';
        try {
          await saveRoundResult(court.courtIndex, r, s1, s2, cycle);
          const key = `${cycle}-${court.courtIndex}-${r}`;
          editingRounds.delete(key);
          scoreDrafts.delete(`c-${key}-1`); scoreDrafts.delete(`c-${key}-2`);
          try { if (navigator.vibrate) navigator.vibrate(15); } catch (_) {}
          showToast(`Erä ${r + 1} tallennettu: ${s1}–${s2}`, { type: 'success', action: { label: 'Kumoa', fn: () => undoResult(court.courtIndex, r, prev, s1, s2, cycle) } });
          if (onDone) onDone();
        } catch (e) {
          if (document.body.contains(save)) { delete save.dataset.busy; save.disabled = false; lbl.textContent = base; hint.className = 'hint err'; hint.textContent = e.message || String(e); }
          notify('Tallennus epäonnistui: ' + (e.message || e));
        }
      };
      return { hint, bar };
    }

    async function saveRoundResult(courtIdx, roundIdx, s1, s2, cycleAtRender) {
      if (!LOCAL_MODE && connState === 'off') throw new Error('Ei verkkoyhteyttä – tulosta ei ole tallennettu. Yritä uudelleen, kun yhteys palaa.');
      const liveCycle = (currentEventData?.previousCycles || []).length;
      if (cycleAtRender !== liveCycle) throw new Error('Kierros on vaihtunut. Tulosta ei tallennettu – tarkista uusi kenttäjako.');
      const data = { team1Score: s1, team2Score: s2, timestamp: new Date().toISOString() };
      await withAuthRetry(() => backend.set(`events/${currentEventId}/rounds/${roundIdx}/results/${courtIdx}`, data), { write: true });
      return true;
    }

    async function undoResult(cIdx, r, prev, s1, s2, cycle) {
      if ((currentEventData?.previousCycles || []).length !== cycle) { notify('Kierros on vaihtunut, kumoaminen ei onnistu.'); return; }
      const path = `events/${currentEventId}/rounds/${r}/results/${cIdx}`;
      const key = `${cycle}-${cIdx}-${r}`;
      scoreDrafts.set(`c-${key}-1`, String(s1));
      scoreDrafts.set(`c-${key}-2`, String(s2));
      try {
        if (prev) await withAuthRetry(() => backend.set(path, prev), { write: true });
        else await withAuthRetry(() => backend.remove(path), { write: true });
        if (activeTab === 'play') playSel = { key: playSel.key, view: r, manual: true };
        showToast('Tulos kumottu');
        lastRenderSig = null;
        renderEventView();
      } catch (e) { notify('Kumoaminen epäonnistui: ' + e.message); }
    }

    // ---------- PELI: oma erä ----------
    function movementInfo(d) {
      const cycles = d.previousCycles || [];
      if (!cycles.length || !currentPlayerName) return null;
      const prev = cycles[cycles.length - 1];
      const oldC = (prev.courts || []).find(c => (c.players || []).includes(currentPlayerName));
      const nowC = myCourt(d);
      if (!oldC || !nowC) return null;
      if (nowC.courtNumber < oldC.courtNumber) return { tone: 'up', ic: 'up', text: `Nousit kentältä ${oldC.courtNumber} kentälle ${nowC.courtNumber}!` };
      if (nowC.courtNumber > oldC.courtNumber) return { tone: 'down', ic: 'down', text: `Siirryit kentältä ${oldC.courtNumber} kentälle ${nowC.courtNumber}.` };
      return { tone: 'info', ic: 'check', text: `Pysyt kentällä ${nowC.courtNumber}.` };
    }

    function renderPlay(v) {
      const d = currentEventData;
      if (!currentPlayerName) {
        v.innerHTML = `<div class="empty"><div class="big-ic">${icon('user')}</div><h2>Kuka olet?</h2><div>Valitse nimesi, niin näet oman kenttäsi, parisi ja vastustajasi.</div></div>`;
        v.appendChild(btn('Valitse nimesi', 'big', () => askIdentify(), 'user'));
        return;
      }
      const court = myCourt(d);
      if (!court) {
        v.innerHTML = `<div class="empty"><div class="big-ic">${icon('user')}</div><h2>Et ole kentällä</h2><div>Nimeäsi ${esc(currentPlayerName)} ei löydy nykyisistä kentistä.</div></div>`;
        v.appendChild(btn('Vaihda nimi', 'big', () => askIdentify(), 'user'));
        return;
      }
      const cycle = (d.previousCycles || []).length;
      const results = courtResults(d, court);
      const target = results.findIndex(x => !x);
      const allDone = target < 0;
      const selKey = `${cycle}-${court.courtIndex}`;
      if (playSel.key !== selKey || !playSel.manual) playSel = { key: selKey, view: allDone ? 'sum' : target, manual: false };
      const view = playSel.view;

      // Otsikko: kenttä + erävalitsin
      const head = el('div', 'court-head');
      head.innerHTML = `<div class="court-no"><span class="k">Kenttä</span><span class="n">${court.courtNumber}</span>${court.players.length === 5 ? '<span class="pill rest">5 pelaajaa</span>' : ''}</div>`;
      v.appendChild(head);
      const seg = el('div', 'seg');
      [0, 1, 2].forEach(r => {
        const b = el('button', view === r ? 'on' : '', `<span class="st ${results[r] ? 'done' : (r === target ? 'cur' : '')}"></span>${eraLabel(r)}`);
        b.type = 'button';
        b.onclick = () => { playSel = { key: selKey, view: r, manual: true }; renderEventView(); };
        seg.appendChild(b);
      });
      const sb = el('button', view === 'sum' ? 'on' : '', `${icon('trophy')}`);
      sb.type = 'button'; sb.setAttribute('aria-label', 'Yhteenveto'); sb.style.flex = '0 0 48px';
      sb.onclick = () => { playSel = { key: selKey, view: 'sum', manual: true }; renderEventView(); };
      seg.appendChild(sb);
      v.appendChild(seg);

      const st = computeRoundStatus(d);
      if (view === 'sum') { renderPlaySummary(v, d, court, results, st); return; }

      const r = view;
      const pair = getRoundPairing(court, r);
      if (!pair) { v.appendChild(el('div', 'empty', 'Erän tiedot puuttuvat.')); return; }
      const res = results[r];
      const key = `${cycle}-${court.courtIndex}-${r}`;
      const isEditing = editingRounds.has(key);
      const iRest = pair.resting === currentPlayerName;

      // Tilarivi
      const mv = (st.totalEntered === 0 && r === 0) ? movementInfo(d) : null;
      if (mv) v.appendChild(el('div', 'banner ' + mv.tone, icon(mv.ic) + `<span>${esc(mv.text)}</span>`));
      else if (iRest) v.appendChild(el('div', 'banner rest', icon('coffee') + `<span>Lepäät tämän erän${!res ? ' – voit kirjata tuloksen' : ''}</span>`));

      if (res && !isEditing) {
        const me1 = pair.team1.includes(currentPlayerName), me2 = pair.team2.includes(currentPlayerName);
        const tag = isCompact() ? 'Sinä' : 'Sinun joukkueesi';
        const m = el('div', 'match');
        m.innerHTML = `${teamResult(pair.team1, me1, res.team1Score, res.team1Score > res.team2Score, me1 ? tag : '')}
          <div class="vs">${res.team1Score === res.team2Score ? 'TASAPELI' : 'VASTAAN'}</div>
          ${teamResult(pair.team2, me2, res.team2Score, res.team2Score > res.team1Score, me2 ? tag : '')}`;
        v.appendChild(m);
        let verdict = '';
        if (me1 || me2) {
          const ms = me1 ? res.team1Score : res.team2Score, os = me1 ? res.team2Score : res.team1Score;
          verdict = ms > os ? '<span class="pill win">Voitto</span>' : (ms < os ? '<span class="pill loss">Tappio</span>' : '<span class="pill tie">Tasapeli</span>');
        }
        v.appendChild(el('div', 'rest-line', `${verdict} ${pair.resting && !iRest ? 'Lepovuorossa: ' + esc(pair.resting) : ''}`));
        const row = el('div', 'btn-row');
        row.style.flex = '0 0 auto';
        row.appendChild(btn('Muokkaa', 'ghost', () => { editingRounds.add(key); renderEventView(); }, 'edit'));
        if (!allDone) row.appendChild(btn(eraLabel(target), '', () => { playSel = { key: selKey, view: target, manual: false }; renderEventView(); }, 'right'));
        else row.appendChild(btn('Yhteenveto', '', () => { playSel = { key: selKey, view: 'sum', manual: true }; renderEventView(); }, 'trophy'));
        v.appendChild(row);
        return;
      }

      if (r !== target && !isEditing) {
        // Tuleva erä: näytetään vain parit
        const me1 = pair.team1.includes(currentPlayerName), me2 = pair.team2.includes(currentPlayerName);
        const m = el('div', 'match');
        const tag = isCompact() ? 'Sinä' : 'Sinun joukkueesi';
        m.innerHTML = `${teamResult(pair.team1, me1, '', false, me1 ? tag : '')}<div class="vs">VASTAAN</div>${teamResult(pair.team2, me2, '', false, me2 ? tag : '')}`;
        v.appendChild(m);
        v.appendChild(el('div', 'rest-line', `Pelataan erän ${target + 1} jälkeen.${pair.resting ? ' Lepovuorossa: ' + esc(pair.resting) : ''}`));
        v.appendChild(btn(`Siirry erään ${target + 1}`, 'ghost', () => { playSel = { key: selKey, view: target, manual: false }; renderEventView(); }));
        return;
      }

      // Syöttö
      const host = el('div', 'pane');
      host.appendChild(buildScoreEditor(court, r));
      if (pair.resting && !iRest) host.appendChild(el('div', 'rest-line', `Lepovuorossa: <b>${esc(pair.resting)}</b>`));
      const { hint, bar } = buildSaveBar(host, court, r, isEditing,
        () => { playSel = { key: selKey, view: null, manual: false }; lastRenderSig = null; },
        isEditing ? () => { editingRounds.delete(key); scoreDrafts.delete(`c-${key}-1`); scoreDrafts.delete(`c-${key}-2`); renderEventView(); } : null);
      host.appendChild(hint);
      host.appendChild(bar);
      v.appendChild(host);
      updateSaveState(host.querySelector('input'));
    }

    function renderPlaySummary(v, d, court, results, st) {
      const done = results.filter(Boolean).length;
      const sts = computeStandings(d).filter(s => court.players.includes(s.name));
      const myIdx = sts.findIndex(s => s.name === currentPlayerName);
      const me = sts[myIdx];
      const proj = projectedCourtMap(d);
      const nc = proj ? proj[currentPlayerName] : null;
      let moveTxt = '–', moveCls = 'stay';
      if (nc != null) {
        if (nc < court.courtNumber) { moveTxt = `▲ K${nc}`; moveCls = 'up'; }
        else if (nc > court.courtNumber) { moveTxt = `▼ K${nc}`; moveCls = 'down'; }
        else { moveTxt = '→ pysyy'; }
      }
      const waiting = (d.courts || []).filter(c => courtResults(d, c).some(x => !x)).map(c => c.courtNumber);
      const box = el('div', 'summary-big');
      let title, text;
      if (st.completed) { title = 'Kierros valmis'; text = 'Kaikki tulokset on syötetty. Järjestäjä vahvistaa siirrot.'; }
      else if (done === 3) { title = 'Kenttäsi on valmis'; text = waiting.length ? `Odotetaan kenttiä ${waiting.join(', ')}.` : ''; }
      else { title = `${done}/3 erää pelattu`; text = 'Tilanne päivittyy jokaisen tuloksen jälkeen.'; }
      box.innerHTML = `<div class="ring">${icon(done === 3 ? 'check' : 'trophy')}</div><h2>${esc(title)}</h2><div class="muted small">${esc(text)}</div>`;
      v.appendChild(box);
      const trio = el('div', 'stat-trio');
      trio.innerHTML = `<div class="stat"><b>${myIdx >= 0 ? (myIdx + 1) + '/' + sts.length : '–'}</b><span>${isCompact() ? 'Sija' : 'Sija kentällä'}</span></div>
        <div class="stat"><b>${me ? recordStr(me) : '–'}</b><span>V–T–H</span></div>
        <div class="stat"><b class="${moveCls}">${esc(moveTxt)}</b><span>Ennuste</span></div>`;
      v.appendChild(trio);
      const games = el('div', 'mini-games');
      const cycle = (d.previousCycles || []).length;
      results.forEach((res, r) => {
        const pair = getRoundPairing(court, r);
        if (!pair) return;
        const g = el('button', 'mini-game');
        g.type = 'button';
        let s = '<span class="faint">–</span>';
        if (pair.resting === currentPlayerName) s = '<span class="pill rest">Lepo</span>';
        else if (res) {
          const inT1 = pair.team1.includes(currentPlayerName);
          const ms = inT1 ? res.team1Score : res.team2Score, os = inT1 ? res.team2Score : res.team1Score;
          s = `<span class="mg-s ${ms > os ? 'up' : (ms < os ? 'down' : 'stay')}">${esc(ms)}–${esc(os)}</span>`;
        }
        const inT1 = pair.team1.includes(currentPlayerName);
        const partner = pair.resting === currentPlayerName ? '' : (inT1 ? pair.team1 : pair.team2).filter(p => p !== currentPlayerName).join('');
        const opp = pair.resting === currentPlayerName ? `${teamNames(pair.team1)} – ${teamNames(pair.team2)}` : `${partner ? 'kanssa ' + esc(partner) + ' · ' : ''}vs ${teamNames(inT1 ? pair.team2 : pair.team1)}`;
        g.innerHTML = `<span class="mg-e">E${r + 1}</span><span class="mg-t">${opp}</span>${s}`;
        g.onclick = () => { playSel = { key: `${cycle}-${court.courtIndex}`, view: r, manual: true }; renderEventView(); };
        games.appendChild(g);
      });
      v.appendChild(games);
    }

    // ---------- KENTÄT / KIERROS ----------
    function gridCols(n) { return n <= 1 ? 1 : (n <= 8 || isCompact() ? 2 : 3); }
    function eraLabel(r) { return isCompact() ? `E${r + 1}` : `Erä ${r + 1}`; }
    function courtLabel(n) { return isCompact() ? `K${n}` : `Kenttä ${n}`; }

    function courtTile(d, court, mine, onClick) {
      const results = courtResults(d, court);
      const target = results.findIndex(x => !x);
      const done = target < 0;
      const t = el('button', 'tile' + (mine ? ' mine' : '') + (done ? ' done' : ''));
      t.type = 'button';
      const dots = `<span class="dots">${results.map((x, i) => `<i class="${x ? 'done' : (i === target ? 'cur' : '')}"></i>`).join('')}</span>`;
      let body, foot;
      if (done) {
        body = `<div class="tm" style="white-space:normal;">${court.players.map(esc).join(', ')}</div>`;
        foot = `${icon('check')} Valmis`;
      } else {
        const pair = getRoundPairing(court, target);
        body = pair ? `<div class="tm">${teamNames(pair.team1)}</div><div class="tv">VS</div><div class="tm">${teamNames(pair.team2)}</div>` : '';
        foot = `${eraLabel(target)}${pair && pair.resting ? ' · lepo: ' + esc(pair.resting) : ''}`;
      }
      t.innerHTML = `<div class="tl-head"><span class="tl-no">${courtLabel(court.courtNumber)}</span>${mine ? '<span class="pill primary">Sinä</span>' : dots}</div>
        <div class="tl-body">${body}</div><div class="tl-foot">${mine ? dots + ' ' : ''}${foot}</div>`;
      t.onclick = onClick;
      return t;
    }

    function renderCourts(v, orgMode) {
      const d = currentEventData;
      const st = computeRoundStatus(d);
      const courts = d.courts || [];
      const mc = myCourt(d);
      if (orgMode) {
        const pct = st.total ? Math.round(100 * st.totalEntered / st.total) : 0;
        const missing = courts.map(c => { const r = courtResults(d, c).findIndex(x => !x); return r < 0 ? null : `K${c.courtNumber}·E${r + 1}`; }).filter(Boolean);
        const card = el('div', 'card tight status-card');

    function openCourtSheet(courtIndex) {
      openSheet({
        live: true,
        state: { mode: 'list', r: null },
        title: () => { const c = (currentEventData.courts || []).find(x => x.courtIndex === courtIndex); return c ? `Kenttä ${c.courtNumber}` : 'Kenttä'; },
        render(s) {

          if (!court) { s.body.appendChild(el('div', 'muted', 'Kenttää ei enää ole (kierros vaihtui).')); return; }
          const cycle = (d.previousCycles || []).length;
          const results = courtResults(d, court);
          const target = results.findIndex(x => !x);
          if (s.state.cycle !== undefined && s.state.cycle !== cycle) s.state = { mode: 'list', r: null };
          s.state.cycle = cycle;
          if (s.state.mode === 'edit') {
            const r = s.state.r;
            const pair = getRoundPairing(court, r);
            const key = `${cycle}-${court.courtIndex}-${r}`;
            const isEdit = !!results[r];
            s.body.appendChild(el('div', 'row between', `<h3>Erä ${r + 1}${isEdit ? ' – muokataan' : ''}</h3>${pair && pair.resting ? `<span class="pill rest">Lepo: ${esc(pair.resting)}</span>` : ''}`));
            const host = el('div', 'col');
            host.appendChild(buildScoreEditor(court, r));
            s.body.appendChild(host);
            const back = () => { editingRounds.delete(key); scoreDrafts.delete(`c-${key}-1`); scoreDrafts.delete(`c-${key}-2`); s.state.mode = 'list'; s.refresh(); };
            const { hint, bar } = buildSaveBar(s.el.querySelector('.sheet'), court, r, isEdit, () => { s.state.mode = 'list'; s.refresh(); }, back);
            s.body.appendChild(hint);
            s.foot.appendChild(bar);
            s.el.querySelector('.sheet').dataset.scoreHost = '1';
            updateSaveState(host.querySelector('input'));

          }
          s.body.appendChild(el('div', 'muted small', court.players.map(p => p === currentPlayerName ? `<b>${esc(p)}</b>` : esc(p)).join(' · ')));
          [0, 1, 2].forEach(r => {
            const pair = getRoundPairing(court, r);
            if (!pair) return;
            const res = results[r];
            const canEnter = res || r === target || currentRole === 'organizer';
            const row = el('button', 'erä-row' + (res ? ' done' : (r === target ? ' cur' : '')));
            row.type = 'button';
            const w1 = res && res.team1Score > res.team2Score, w2 = res && res.team2Score > res.team1Score;
            row.innerHTML = `<span class="er-n">${eraLabel(r).toUpperCase()}</span>
              <span class="er-t"><div${w1 ? ' class="up"' : ''}>${teamNames(pair.team1)}</div><div${w2 ? ' class="up"' : ''}>${teamNames(pair.team2)}</div>${pair.resting ? `<div class="tiny muted">Lepo: ${esc(pair.resting)}</div>` : ''}</span>
              <span class="er-s${res ? '' : ' pend'}">${res ? `${esc(res.team1Score)}–${esc(res.team2Score)}` : (canEnter ? 'Syötä ›' : 'Odottaa')}</span>`;
            if (canEnter) row.onclick = () => { if (res) editingRounds.add(`${cycle}-${court.courtIndex}-${r}`); s.state.mode = 'edit'; s.state.r = r; s.refresh(); };
            else row.disabled = true;
            s.body.appendChild(row);
          });
        }
      });
    }

    // ---------- Sivutettu lista (ei vieritystä) ----------
    // rows: [{html, me}] ; head: html ; cls: grid-luokka
    function pagedList(parent, key, head, rows, cls) {
      const list = el('div', 'list card');
      list.style.padding = '4px';
      const rowsEl = el('div', 'list-rows');
      const pager = el('div', 'pager');
      list.appendChild(rowsEl); list.appendChild(pager);
      parent.appendChild(list);
      const headNode = head ? el('div', `lrow head ${cls}`, head) : null;
      if (headNode) rowsEl.appendChild(headNode);
      const mk = (r) => {
        const n = el('div', `lrow ${cls}${r.me ? ' me' : ''}`, r.html);
        if (r.onClick) { n.style.cursor = 'pointer'; n.onclick = r.onClick; }
        return n;
      };
      // Sivutus mitattujen rivikorkeuksien mukaan (nimet voivat rivittyä, joten rivit eivät ole yhtä korkeita).
      // Jos tila ei riitä edes yhdelle riville, lista vierii.
      const nodes = rows.map(mk);
      nodes.forEach(n => rowsEl.appendChild(n));
      const hs = nodes.map(n => n.offsetHeight || 42);
      const avail = rowsEl.clientHeight - (headNode ? headNode.offsetHeight : 0);
      const total = hs.reduce((a, b) => a + b, 0);
      nodes.forEach(n => n.remove());
      let pagesIdx = [[0, rows.length]];
      if (avail > 0 && total > avail + 1 && rows.length > 1) {
        const lim = Math.max(1, avail - 44); // sivutuspalkki vie tilaa
        pagesIdx = [];
        let s0 = 0, h = 0;
        hs.forEach((x, i) => { if (i > s0 && h + x > lim) { pagesIdx.push([s0, i]); s0 = i; h = 0; } h += x; });
        pagesIdx.push([s0, rows.length]);
      }
      const pages = pagesIdx.length;
      if (pageState[key] === undefined || pageState[key] >= pages) {
        const meIdx = rows.findIndex(r => r.me);
        pageState[key] = meIdx >= 0 ? pagesIdx.findIndex(([a, b]) => meIdx >= a && meIdx < b) : 0;
      }
      const draw = () => {
        Array.from(rowsEl.querySelectorAll('.lrow:not(.head)')).forEach(n => n.remove());
        const p = pageState[key];
        const [a, b] = pagesIdx[p];
        nodes.slice(a, b).forEach(n => rowsEl.appendChild(n));
        rowsEl.scrollTop = 0;
        if (pages > 1) {
          pager.innerHTML = `<button class="icon-btn" type="button" aria-label="Edellinen sivu" ${p === 0 ? 'disabled' : ''}>${icon('left')}</button><span class="pg">${a + 1}–${b} / ${rows.length}</span><button class="icon-btn" type="button" aria-label="Seuraava sivu" ${p >= pages - 1 ? 'disabled' : ''}>${icon('right')}</button>`;
          const [prev, next] = pager.querySelectorAll('button');
          prev.onclick = () => { pageState[key] = Math.max(0, pageState[key] - 1); draw(); };
          next.onclick = () => { pageState[key] = Math.min(pages - 1, pageState[key] + 1); draw(); };
        } else pager.classList.add('hidden');
      };
      // Pyyhkäisy vaihtaa sivua
      let x0 = null;
      rowsEl.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
      rowsEl.addEventListener('touchend', (e) => {
        if (x0 === null || pages < 2) return;
        const dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) < 50) return;
        pageState[key] = Math.max(0, Math.min(pages - 1, pageState[key] + (dx < 0 ? 1 : -1)));
        draw();
      });
      draw();
    }

    // ---------- Vieritettävä lista (sijoitus) ----------
    // Otsikkorivi pysyy paikallaan, rivit vierivät. Vierityskohta säilyy päivitysten yli;
    // ensimmäisellä kerralla oma rivi vieritetään näkyviin.
    const listScroll = {};
    function scrollList(parent, key, head, rows, cls) {
      const list = el('div', 'list card scroll-list');
      list.style.padding = '4px';
      if (head) list.appendChild(el('div', `lrow head ${cls}`, head));
      const rowsEl = el('div', 'list-rows');
      list.appendChild(rowsEl);
      parent.appendChild(list);
      let meNode = null;
      rows.forEach(r => {
        const n = el('div', `lrow ${cls}${r.me ? ' me' : ''}`, r.html);
        if (r.onClick) { n.style.cursor = 'pointer'; n.onclick = r.onClick; }
        if (r.me && !meNode) meNode = n;
        rowsEl.appendChild(n);
      });
      if (listScroll[key] !== undefined) rowsEl.scrollTop = listScroll[key];
      else if (meNode && meNode.offsetTop + meNode.offsetHeight > rowsEl.clientHeight) {
        rowsEl.scrollTop = Math.max(0, meNode.offsetTop - (rowsEl.clientHeight - meNode.offsetHeight) / 2);
      }
      rowsEl.addEventListener('scroll', () => { listScroll[key] = rowsEl.scrollTop; }, { passive: true });
    }

    function mvHtml(courtNum, nc) {
      if (nc === undefined || nc === null) return '<span class="stay">–</span>';
      if (nc < courtNum) return `<span class="up">▲K${nc}</span>`;
      if (nc > courtNum) return `<span class="down">▼K${nc}</span>`;
      return '<span class="stay">→</span>';
    }

        scrollList(v, 'st-court-' + standCourt, `<span>#</span><span>${isCompact() ? 'Nimi' : 'Pelaaja'}</span><span class="num">V–T–H</span>${tasoHead}<span class="num" title="Ennuste">Enn.</span>`,

    // ---------- MINÄ (pelaaja) ----------
    function myCycleRows(d) {
      const cycles = d.previousCycles || [];
      const rows = [];
      cycles.forEach((cycle, idx) => {
        const c = (cycle.courts || []).find(x => (x.players || []).includes(currentPlayerName));
        if (!c) return;
        const next = idx + 1 < cycles.length ? cycles[idx + 1].courts || [] : d.courts || [];
        const nc = (next.find(x => (x.players || []).includes(currentPlayerName)) || {}).courtNumber;
        const s = (cycle.standings || []).find(x => x.name === currentPlayerName);
        rows.push({ idx, court: c, nc, s, cycle });
      });
      return rows.reverse();
    }

    // ============================================================
    // PELAAJAT (järjestäjä): napauta kahta pelaajaa = vaihto
    // ============================================================
    function currentOrder(d) {
      const ordered = [];
      (d.courts || []).forEach(c => (c.players || []).forEach(p => { if (!ordered.includes(p)) ordered.push(p); }));
      (d.playerNames || []).forEach(p => { if (!ordered.includes(p)) ordered.push(p); });
      return ordered;
    }

    function renderPlayers(v) {
      const d = currentEventData;
      const base = currentOrder(d);
      if (!pm || (!pmDirty() && JSON.stringify(pm.base) !== JSON.stringify(base))) pm = { base, list: [...base], sel: null, adding: false };
      const list = pm.list;
      const sizes = sizesForCount(list.length, (d.courts || []).map(c => c.players.length));
      const plan = sizes ? planPlayerChanges(d, list) : null;
      const resetSet = new Set(plan ? plan.resetCourts : []);
      const dirty = pmDirty();

      const info = el('div', 'row between');
      info.style.flex = '0 0 auto';
      info.innerHTML = `<div><h2>${list.length} pelaajaa</h2><div class="muted small">${pm.sel !== null ? (isCompact() ? `Raahaa tai napauta toista` : `Raahaa toiselle kentälle tai napauta toista pelaajaa`) : 'Valitse pelaaja napauttamalla, niin voit siirtää sen'}</div></div>${sizes ? `<span class="count-badge ok">${sizes.length} kenttää</span>` : '<span class="count-badge bad">ei tuettu</span>'}`;

      const groups = [];
      if (sizes) { let i = 0; sizes.forEach((n, ci) => { groups.push({ ci, names: list.slice(i, i + n), start: i }); i += n; }); }
      else groups.push({ ci: -1, names: list, start: 0 });
      grid.style.gridTemplateColumns = groups.length <= 4 ? '1fr' : `repeat(${gridCols(groups.length)}, minmax(0,1fr))`;
      const origSet = new Set(pm.base);
      groups.forEach(g => {
        const box = el('div', 'pm-court' + (resetSet.has(g.ci + 1) ? ' reset' : ''));
        box.dataset.ci = g.ci; box.dataset.start = g.start; box.dataset.end = g.start + g.names.length;

        g.names.forEach((name, k) => {
          const idx = g.start + k;
          const c = el('button', 'pchip' + (pm.sel === idx ? ' sel' : '') + (!origSet.has(name) ? ' new' : '') + (pm.sel !== null && pm.sel !== idx ? ' target' : ''));
          c.type = 'button'; c.textContent = name;
          c.dataset.idx = idx;
          c.addEventListener('pointerdown', (e) => pmDragStart(e, c, idx, name));
          // Osoitin hoitaa napautuksen itse (pointerup); click jää näppäimistölle.
          c.onclick = () => { if (Date.now() - pmPointerAt > 700) pmTap(idx); };
          chips.appendChild(c);
        });
        box.appendChild(chips);
        grid.appendChild(box);
      });
      v.appendChild(grid);

    // Raahaus: pelaajan pudotus toisen pelaajan päälle vaihtaa paikat, kentän tyhjään kohtaan
    // pudotus siirtää pelaajan kentän viimeiseksi (muut siirtyvät yhden paikan). Pointer Events
    // kattaa hiiren, kosketuksen ja kynän; raahaus alkaa vasta kun sormi liikkuu, joten napautus toimii kuten ennen.
    // Raahata voi vain valittua pelaajaa (napautus valitsee), jotta puhelimessa vieritys ei siirrä pelaajia vahingossa.
    function pmTap(idx) {
      const list = pm.list;
      if (pm.sel === null) pm.sel = idx;
      else if (pm.sel === idx) pm.sel = null;
      else { [list[pm.sel], list[idx]] = [list[idx], list[pm.sel]]; pm.sel = null; }
      renderEventView();
    }
    function pmDragStart(e, chip, idx, name) {
      if (e.button !== undefined && e.button !== 0) return;
      if (pmDrag && pmDrag.active) return;
      pmDrag = { chip, idx, name, id: e.pointerId, x0: e.clientX, y0: e.clientY, active: false, ghost: null, target: null, pending: false, canDrag: !!pm && pm.sel === idx, moved: false };
      const move = (ev) => {
        if (!pmDrag || ev.pointerId !== pmDrag.id) return;
        if (!pmDrag.active) {
          if (Math.hypot(ev.clientX - pmDrag.x0, ev.clientY - pmDrag.y0) < 8) return;
          if (!pmDrag.canDrag) { pmDrag.moved = true; return; } // valitsematonta ei raahata
          pmDrag.active = true;
          try { chip.setPointerCapture(ev.pointerId); } catch (_) {}
          const r = chip.getBoundingClientRect();
          const g = chip.cloneNode(true);
          g.className = 'pchip pchip-ghost';
          g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
          pmDrag.ghost = g; pmDrag.dx = pmDrag.x0 - r.left; pmDrag.dy = pmDrag.y0 - r.top + (ev.pointerType === 'touch' ? 28 : 0); // kosketuksessa sormen yläpuolelle
          document.body.appendChild(g);
          chip.classList.add('dragging');
          if (navigator.vibrate) { try { navigator.vibrate(10); } catch (_) {} }
        }
        ev.preventDefault();
        pmDrag.ghost.style.transform = `translate(${ev.clientX - pmDrag.dx}px, ${ev.clientY - pmDrag.dy}px) scale(1.06)`;
        pmSetDropTarget(pmFindTarget(ev.clientX, ev.clientY));
      };
      const end = (ev) => {
        if (!pmDrag || ev.pointerId !== pmDrag.id) return;
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', end);
        window.removeEventListener('pointercancel', end);
        const st = pmDrag;
        pmDrag = null;
        if (!st.active) {
          if (st.moved) { pmPointerAt = Date.now(); return; }
          if (ev.type === 'pointerup' && pm && pm.list[st.idx] === st.name) { pmPointerAt = Date.now(); pmTap(st.idx); }
          return;
        }
        pmPointerAt = Date.now();
        if (st.ghost) st.ghost.remove();
        chip.classList.remove('dragging');
        pmSetDropTarget(null, st);
        const t = ev.type === 'pointerup' ? pmFindTarget(ev.clientX, ev.clientY) : null;
        if (t && pm && pm.list[st.idx] === st.name) pmApplyDrop(st.idx, t);
        lastRenderSig = null;
        renderEventView();
      };
      window.addEventListener('pointermove', move, { passive: false });
      window.addEventListener('pointerup', end);
      window.addEventListener('pointercancel', end);
    }
    function pmFindTarget(x, y) {
      const elAt = document.elementFromPoint(x, y);
      if (!elAt) return null;
      const chip = elAt.closest('.pchip:not(.pchip-ghost)');
      if (chip && chip.dataset.idx !== undefined) return { kind: 'chip', idx: +chip.dataset.idx, node: chip };
      const box = elAt.closest('.pm-court');
      if (box && box.dataset.end !== undefined) return { kind: 'court', ci: +box.dataset.ci, start: +box.dataset.start, end: +box.dataset.end, node: box };
      return null;
    }
    function pmSetDropTarget(t, st = pmDrag) {
      const prev = st && st.target;
      if (prev && (!t || prev.node !== t.node)) prev.node.classList.remove('drop');
      if (t && st && ((t.kind === 'chip' && t.idx === st.idx) || (t.kind === 'court' && st.idx >= t.start && st.idx < t.end))) t = null;
      if (t) t.node.classList.add('drop');
      if (st) st.target = t;
    }
    function pmApplyDrop(from, t) {
      const list = pm.list;
      const name = list[from];
      if (t.kind === 'chip') {
        if (t.idx === from) return;
        const other = list[t.idx];
        [list[from], list[t.idx]] = [other, name];
        pm.sel = null;
        showToast(`${name} ⇄ ${other}`);
      } else {
        // kentän viimeiseksi; jos pelaaja on jo tällä kentällä, ei muutosta
        if (from >= t.start && from < t.end) return;
        list.splice(from, 1);
        list.splice(t.end - 1, 0, name);
        pm.sel = null;
        showToast(t.ci >= 0 ? `${name} siirretty kentälle ${t.ci + 1}` : `${name} siirretty`);
      }
    }
    function pmDirty() { return !!pm && JSON.stringify(pm.list) !== JSON.stringify(pm.base); }

    async function savePlayerChanges() {
      const list = pm.list;
      const n = list.length;
      if (!isValidPlayerCount(n)) { notify(`Pelaajamäärä ${n} ei ole tuettu. Käytä 4, 5, 8, 9, 10 tai vähintään 12 pelaajaa.`); return; }
      const plan = planPlayerChanges(currentEventData, list);
      if (!plan) { notify('Kenttäjakoa ei voitu muodostaa.'); return; }
      if (plan.resetCourts.length > 0) {
        if (!(await askConfirm(`Seuraavien kenttien erät nollataan, koska niiden pelaajat tai taukovuorot muuttuvat: kenttä ${plan.resetCourts.join(', ')}.\n\nMuiden kenttien tulokset ja aiempien kierrosten historia säilyvät.`, { ok: 'Tallenna ja nollaa', title: 'Tallennetaanko muutokset?' }))) return;
      }
      showLoading('Tallennetaan...');
      try {
        await withAuthRetry(() => backend.update('events/' + currentEventId, { playerNames: list, courts: plan.courts, rounds: plan.rounds }), { write: true });
        scoreDrafts.clear(); editingRounds.clear();
        if (currentPlayerName && !list.includes(currentPlayerName)) {
          currentPlayerName = null;
          const entry = getEventEntry(currentEventId);
          if (entry) upsertRecentEvent({ ...entry, myPlayerName: null });
        }
        pm = null;
        hideLoading();
        showToast('Pelaajamuutokset tallennettu', { type: 'success' });
        lastRenderSig = null;
        renderEventView();
      } catch (e) {
        hideLoading();
        notify('Virhe: ' + e.message);
      }
    }

    // Pelaajan nimen muokkaus (järjestäjä). preset = valmiiksi valittu nimi.
    function openPlayerRenameSheet(preset) {
      if (!currentEventData) return;
      openSheet({
        title: 'Pelaajan nimi',
        full: !preset && (currentEventData.playerNames || []).length > 16,
        state: { name: preset || null },
        render(s) {
          const d = currentEventData;
          const pending = pm && pmDirty() ? pm.list : null;
          if (!s.state.name) {
            s.body.appendChild(el('div', 'muted small', 'Valitse pelaaja, jonka nimeä haluat muokata.'));
            const seen = new Set();
            const group = (label, names) => {
              if (!names.length) return;
              s.body.appendChild(el('div', 'group-label', esc(label)));
              const g = el('div', 'name-grid');
              names.forEach(n => {
                const b = el('button', 'name-btn');
                b.type = 'button'; b.textContent = n;
                b.onclick = () => { s.state.name = n; s.refresh(); };
                g.appendChild(b); seen.add(n);
              });
              s.body.appendChild(g);
            };
            (d.courts || []).forEach(c => group(`Kenttä ${c.courtNumber}`, c.players || []));
            group('Muut', (d.playerNames || []).filter(n => !seen.has(n)));
            if (pending) group('Lisätyt (tallentamatta)', pending.filter(n => !seen.has(n)));
            return;
          }
          const oldName = s.state.name;
          s.body.innerHTML = `<div class="muted small">Nykyinen nimi: <b>${esc(oldName)}</b></div><input id="prName" class="field" type="text" maxlength="30" enterkeyhint="done" placeholder="Uusi nimi"><div class="hint" id="prErr" style="text-align:left;">Nimi vaihtuu kaikkialle: kentät, erät, sijoitus ja historia.</div>`;
          const inp = s.body.querySelector('#prName');
          inp.value = oldName;
          const err = (m) => { const e = s.body.querySelector('#prErr'); e.className = 'hint err'; e.style.textAlign = 'left'; e.textContent = m; };
          const save = async () => {
            const newName = inp.value.trim();
            if (newName === oldName) { s.close(); return; }
            const ne = playerNameError(newName);
            if (ne) return err(ne);
            const ev = currentEventData;
            const taken = new Set([...(ev.playerNames || []), ...(pm ? pm.list : [])]);
            (ev.courts || []).forEach(c => (c.players || []).forEach(p => taken.add(p)));
            (ev.previousCycles || []).forEach(pc => (pc.courts || []).forEach(c => (c.players || []).forEach(p => taken.add(p))));
            if (taken.has(newName)) return err(`Nimi "${newName}" on jo käytössä tässä tapahtumassa.`);
            const inEvent = (ev.playerNames || []).includes(oldName) || (ev.courts || []).some(c => (c.players || []).includes(oldName));
            const fixPm = () => {
              if (!pm) return;
              pm.list = pm.list.map(n => n === oldName ? newName : n);
              pm.base = pm.base.map(n => n === oldName ? newName : n);
            };
            if (!inEvent) { fixPm(); s.close(); lastRenderSig = null; renderEventView(); showToast(`${oldName} → ${newName}`); return; }
            sv.disabled = true;
            try {
              const fresh = await loadEvent(currentEventId);
              if (!fresh) throw new Error('Tapahtumaa ei löytynyt.');
              if (!(fresh.playerNames || []).includes(oldName)) throw new Error('Pelaajaa ei enää löydy.');
              if ((fresh.playerNames || []).includes(newName)) throw new Error(`Nimi "${newName}" on jo käytössä.`);
              const fields = renamePlayerFields(fresh, oldName, newName);
              await withAuthRetry(() => backend.update('events/' + currentEventId, fields), { write: true });
              fixPm();
              if (currentPlayerName === oldName) {
                currentPlayerName = newName;
                const entry = getEventEntry(currentEventId);
                if (entry) upsertRecentEvent({ ...entry, myPlayerName: newName });
              }
              s.close();
              lastRenderSig = null;
              renderEventView();
              showToast(`Nimi vaihdettu: ${newName}`, { type: 'success' });
            } catch (e) { sv.disabled = false; err('Virhe: ' + e.message); }
          };
          inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); save(); } });
          const row = el('div', 'btn-row');
          row.appendChild(btn(preset ? 'Peruuta' : 'Takaisin', 'ghost', () => { if (preset) s.close(); else { s.state.name = null; s.refresh(); } }));
          const sv = btn('Tallenna', '', save, 'check');
          row.appendChild(sv);
          s.foot.appendChild(row);
          setTimeout(() => { try { inp.focus(); inp.select(); } catch (e) {} }, 50);
        }
      });
    }

    // ---------- Testityökalut (vain paikallinen tila) ----------
    async function fillRandomResults() {
      const d = currentEventData;
      if (!d) return;
      const updates = {};
      for (let r = 0; r < 3; r++) {
        (d.courts || []).forEach(court => {
          if (getCourtResult(d, r, court.courtIndex)) return;
          const a = Math.floor(Math.random() * 12);
          const b = Math.floor(Math.random() * 12); // tasapelit sallittu
          updates[`rounds/${r}/results/${court.courtIndex}`] = { team1Score: a, team2Score: b, timestamp: new Date().toISOString() };
        });
      }
      if (Object.keys(updates).length === 0) { showToast('Kaikki tulokset on jo syötetty'); return; }
      try { await withAuthRetry(() => backend.update('events/' + currentEventId, updates), { write: true }); }
      catch (e) { notify('Virhe: ' + e.message); }
    }

    async function applyPromotions() {
      if (!currentEventId) return;
      showLoading('Tallennetaan siirtoja...');
      try {
        const fresh = await loadEvent(currentEventId);
        if (!fresh) throw new Error('Tapahtumaa ei löytynyt.');
        if (!isCycleComplete(fresh)) throw new Error('Kierros ei ole vielä valmis.');
        const standings = computeStandings(fresh);
        const { courts: newCourts, restCounts, lastRestCycle } = computeNextCycle(fresh);
        const prevCycle = { courts: fresh.courts, rounds: fresh.rounds, standings, completedAt: new Date().toISOString() };
        const cycles = [...(fresh.previousCycles || []), prevCycle];
        const newRounds = [{ roundIndex: 0, results: {} }, { roundIndex: 1, results: {} }, { roundIndex: 2, results: {} }];
        await withAuthRetry(() => backend.update('events/' + currentEventId, {
          previousCycles: cycles, courts: newCourts, rounds: newRounds,
          restCounts: encodeMap(restCounts), lastRestCycle: encodeMap(lastRestCycle)
        }), { write: true });
        editingRounds.clear(); scoreDrafts.clear();
        hideLoading();
        eventMode = 'tabs';
        activeTab = 'round';
        lastRenderSig = null;
        renderEventView();
        showToast(`Kierros ${cycles.length + 1} alkoi`, { type: 'success' });
      } catch (e) { hideLoading(); notify('Virhe: ' + e.message); }
    }

    function openHistorySheet() {
      openSheet({
        title: 'Historia',
        full: true,
        live: true,
        state: { cyc: null, court: null, edit: null },
        render(s) {
          const d = currentEventData;
          const cycles = d.previousCycles || [];

          const st = s.state;
          if (st.cyc === null || st.cyc >= cycles.length) st.cyc = cycles.length - 1;
          const cycle = cycles[st.cyc];
          const courts = cycle.courts || [];
          if (st.court === null || !courts.some(c => c.courtIndex === st.court)) st.court = courts.length ? courts[0].courtIndex : null;
          const cchips = el('div', 'chips');
          cycles.map((c, i) => i).reverse().forEach(i => {
            const b = el('button', 'chip' + (i === st.cyc ? ' on' : ''), `Kierros ${i + 1}`);
            b.type = 'button'; b.onclick = () => { st.cyc = i; st.court = null; st.edit = null; s.refresh(); };
            cchips.appendChild(b);
          });
          s.body.appendChild(cchips);
          const kchips = el('div', 'seg');
          courts.forEach(c => {
            const b = el('button', c.courtIndex === st.court ? 'on' : '', `K${c.courtNumber}`);
            b.type = 'button'; b.onclick = () => { st.court = c.courtIndex; st.edit = null; s.refresh(); };
            kchips.appendChild(b);
          });
          s.body.appendChild(kchips);
          const court = courts.find(c => c.courtIndex === st.court);
          if (!court) return;
          if (cycle.completedAt) s.body.appendChild(el('div', 'tiny muted', 'Päättyi ' + esc(formatTimestamp(cycle.completedAt))));
          (court.rounds || []).forEach((pair, rIdx) => {
            const res = cycle.rounds?.[rIdx]?.results?.[court.courtIndex];
            const key = `${st.cyc}-${court.courtIndex}-${rIdx}`;
            if (st.edit === key) {
              const k1 = `h-${key}-1`, k2 = `h-${key}-2`;
              const v1 = scoreDrafts.has(k1) ? scoreDrafts.get(k1) : (res?.team1Score ?? '');
              const v2 = scoreDrafts.has(k2) ? scoreDrafts.get(k2) : (res?.team2Score ?? '');
              const box = el('div', 'card tight col');
              box.innerHTML = `<h3>Erä ${rIdx + 1} – muokataan</h3>
                <div class="row between"><span class="small" style="flex:1;min-width:0;">${teamNames(pair.team1)}</span><input class="score-in" type="number" min="0" max="99" inputmode="numeric" value="${esc(v1)}" data-draft="${k1}"></div>
                <div class="row between"><span class="small" style="flex:1;min-width:0;">${teamNames(pair.team2)}</span><input class="score-in" type="number" min="0" max="99" inputmode="numeric" value="${esc(v2)}" data-draft="${k2}"></div>`;
              const row = el('div', 'btn-row');
              row.appendChild(btn('Peruuta', 'ghost', () => { st.edit = null; scoreDrafts.delete(k1); scoreDrafts.delete(k2); s.refresh(); }));
              const sv = btn('Tallenna', '', async () => {
                const ins = box.querySelectorAll('input');
                const s1 = parseInt(ins[0].value), s2 = parseInt(ins[1].value);
                if (isNaN(s1) || isNaN(s2) || s1 < 0 || s2 < 0 || s1 > 99 || s2 > 99) { notify('Syötä molemmat pisteet (0–99).'); return; }
                sv.disabled = true;
                try {
                  await saveHistoryResult(st.cyc, court.courtIndex, rIdx, s1, s2);
                  st.edit = null; scoreDrafts.delete(k1); scoreDrafts.delete(k2);
                  showToast('Historian tulos päivitetty', { type: 'success' });
                  s.refresh();
                } catch (e) { sv.disabled = false; notify('Virhe: ' + e.message); }
              }, 'check');
              row.appendChild(sv);
              box.appendChild(row);
              s.body.appendChild(box);
              return;
            }
            const row = el('button', 'erä-row' + (res ? ' done' : ''));
            row.type = 'button';
            const w1 = res && res.team1Score > res.team2Score, w2 = res && res.team2Score > res.team1Score;
            row.innerHTML = `<span class="er-n">${eraLabel(rIdx).toUpperCase()}</span><span class="er-t"><div${w1 ? ' class="up"' : ''}>${teamNames(pair.team1)}</div><div${w2 ? ' class="up"' : ''}>${teamNames(pair.team2)}</div>${pair.resting ? `<div class="tiny muted">Lepo: ${esc(pair.resting)}</div>` : ''}</span><span class="er-s${res ? '' : ' pend'}">${res ? `${esc(res.team1Score)}–${esc(res.team2Score)}` : 'Lisää'} <span class="faint">${icon('edit')}</span></span>`;
            row.onclick = () => { st.edit = key; s.refresh(); };
            s.body.appendChild(row);
          });
          // Siirrot
          const next = st.cyc + 1 < cycles.length ? cycles[st.cyc + 1].courts || [] : d.courts || [];
          const nextOf = {};

          mv.style.gap = '2px';

          mv.innerHTML = '<div class="label">Pelaajat ja siirrot</div>' + (court.players || []).map(p => {
            const x = (cycle.standings || []).find(y => y.name === p);

            return `<div class="mv-p"><b>${esc(p)}</b><span class="muted small" style="flex:1;min-width:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${x ? recordStr(x) + ' · ' + ratingLabel(x.rating) + (al ? ' · ' + al : '') : al}</span><span style="width:3.4em;text-align:right;">${mvHtml(court.courtNumber, nextOf[p])}</span></div>`;
          }).join('');
          s.body.appendChild(mv);
          s.body.appendChild(el('div', 'tiny muted', 'Muokkaus päivittää kierroksen sijoitukset, mutta ei jo tehtyjä siirtoja.'));
        }
      });
    }

    async function saveHistoryResult(cycIdx, courtIdx, rIdx, s1, s2) {
      const fresh = await loadEvent(currentEventId);
      const pc = fresh.previousCycles[cycIdx];
      const newRes = { team1Score: s1, team2Score: s2, timestamp: new Date().toISOString() };
      const rounds = JSON.parse(JSON.stringify(pc.rounds || []));
      if (!rounds[rIdx]) rounds[rIdx] = { roundIndex: rIdx, results: {} };
      if (!rounds[rIdx].results) rounds[rIdx].results = {};
      rounds[rIdx].results[courtIdx] = newRes;
      const cycPlayers = [];
      (pc.courts || []).forEach(c => (c.players || []).forEach(p => cycPlayers.push(p)));
      const newStandings = computeStandings({ courts: pc.courts, rounds, playerNames: cycPlayers, previousCycles: (fresh.previousCycles || []).slice(0, cycIdx), seedOrder: fresh.seedOrder, useSeedPrior: fresh.useSeedPrior, seedByCourt: fresh.seedByCourt });
      // Yksi atominen päivitys: tulos ja sijoitukset
      await withAuthRetry(() => backend.update('events/' + currentEventId, {
        [`previousCycles/${cycIdx}/rounds/${rIdx}/results/${courtIdx}`]: newRes,
        [`previousCycles/${cycIdx}/standings`]: newStandings
      }), { write: true });
    }

    async function updateApp() {

      try {

    function moveBadge(courtNum, nc, tv) {
      if (nc === undefined || nc === null) return tv ? '<span class="tv-same">–</span>' : '<span class="mv-stay">–</span>';
      const cls = nc < courtNum ? 'up' : (nc > courtNum ? 'down' : 'stay');
      const sym = nc < courtNum ? '▲' : (nc > courtNum ? '▼' : '→');
      const label = nc < courtNum ? `nousee K${nc}` : (nc > courtNum ? `putoaa K${nc}` : 'pysyy');
      return tv ? `<span class="tv-${cls === 'stay' ? 'same' : cls}">${sym} ${nc === courtNum ? '' : 'K' + nc}</span>` : `<span class="mv-${cls}">${sym} ${label}</span>`;
    }

    let tvPage = 0, tvTimer = null, tvSeen = null, tvFlashTimer = null, tvIdleTimer = null;
    const TV_PER_PAGE = 6;

    function toggleFullscreen() {
      const el = document.documentElement;
      if (!document.fullscreenElement) {
        const p = el.requestFullscreen ? el.requestFullscreen() : null;
        if (p && p.then) p.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {});
      } else if (document.exitFullscreen) document.exitFullscreen();
    }

    // TV avataan omaan välilehteen, joten sulkeminen sulkee välilehden. Jos selain ei salli sitä
    // (esim. linkki avattu suoraan), siirrytään sovelluksen etusivulle.
    function closeTV() {
      try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch (e) {}
      try { window.close(); } catch (e) {}
      setTimeout(() => {
        if (window.closed) return;
        window.location.href = window.location.pathname + (URL_PARAMS.get('local') === '1' ? '?local=1' : '');
      }, 250);
    }

    function initTVMode() {
      tvMode = true;
      document.body.classList.add('tv-mode');
      document.title = '3 Erää – TV';
      const eventId = normalizeCode(URL_PARAMS.get('event'));
      if (!eventId || !isValidCodeFormat(eventId)) { document.body.innerHTML = '<div style="padding:40px;color:#fff;font-size:24px;">Tapahtumaa ei löytynyt.</div>'; return; }
      currentEventId = eventId;
      $('tvFs').onclick = toggleFullscreen;
      $('tvClose').onclick = closeTV;
      document.addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'F') toggleFullscreen(); });
      const wake = () => {
        document.body.classList.remove('tv-idle');
        clearTimeout(tvIdleTimer);
        tvIdleTimer = setTimeout(() => document.body.classList.add('tv-idle'), 3000);
      };
      ['mousemove', 'mousedown', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, wake));
      wake();
      requestWake();
      listenEvent(eventId, (d) => { if (!d) return; currentEventData = d; renderTVView(d); });
      tvTimer = setInterval(() => { if (currentEventData) { tvPage++; renderTVView(currentEventData); } }, 10000);
    }

    function renderTVQR(d) {
      if (tvQrGenerated) return;
      const container = $('tvQr');
      if (!container) return;
      if (typeof qrcode !== 'function') return;
      try {
        const url = `${location.origin}${location.pathname}?event=${encodeURIComponent(d.playerCode || currentEventId)}${LOCAL_MODE ? '&local=1' : ''}`;
        const qr = qrcode(0, 'M');
        qr.addData(url);
        qr.make();
        container.innerHTML = qr.createImgTag(5, 0);
        tvQrGenerated = true;
      } catch (e) {
        console.warn('TV QR -virhe', e);
        container.innerHTML = '';
      }
    }

    function showTVFlash(d, r, c) {
      const court = (d.courts || []).find(x => x.courtIndex === c);
      const res = d.rounds?.[r]?.results?.[c];
      const pair = court && court.rounds && court.rounds[r];
      if (!res || !pair) return;
      const el = $('tvFlash');
      el.innerHTML = `Kenttä ${court.courtNumber} · erä ${r + 1}: ${teamStr(pair.team1)} <strong>${esc(res.team1Score)}–${esc(res.team2Score)}</strong> ${teamStr(pair.team2)}${res.team1Score === res.team2Score ? ' · tasapeli' : ''}`;
      el.classList.add('show');
      clearTimeout(tvFlashTimer);
      tvFlashTimer = setTimeout(() => el.classList.remove('show'), 8000);
    }

    function renderTVView(d) {
      $('tvTitle').textContent = d.name || d.playerCode || 'Tapahtuma';
      const st = computeRoundStatus(d);
      const cycleCount = (d.previousCycles || []).length;
      const cycleNum = cycleCount + 1;
      $('tvStatus').innerHTML = st.completed
        ? `Kierros ${cycleNum} valmis · ${st.totalEntered}/${st.total}`
        : `Kierros <strong>${cycleNum}</strong> · Erä ${st.currentRound}/3 · ${st.totalEntered}/${st.total} tulosta`;
      renderTVQR(d);

      const courts = d.courts || [];
      const pages = Math.max(1, Math.ceil(courts.length / TV_PER_PAGE));
      const page = tvPage % pages;
      const slice = courts.slice(page * TV_PER_PAGE, (page + 1) * TV_PER_PAGE);
      $('tvCourtsPage').textContent = pages > 1 ? `${page + 1}/${pages}` : '';

      const colsFor = (n) => n <= 1 ? 1 : (n <= 4 ? 2 : 3);
      const cEl = $('tvCourts');
      cEl.style.gridTemplateColumns = `repeat(${colsFor(slice.length)}, minmax(0, 1fr))`;
      cEl.innerHTML = slice.map(court => {
        const isRest = court.players.length === 5;
        const curRound = [0, 1, 2].find(r => !d.rounds?.[r]?.results?.[court.courtIndex]);
        let h = `<div class="tv-court${isRest ? ' rest' : ''}"><div class="tv-court-title">Kenttä ${court.courtNumber}${isRest ? ' · 5P' : ''}</div>`;
        (court.rounds || []).forEach((pair, rIdx) => {
          const res = d.rounds?.[rIdx]?.results?.[court.courtIndex];
          const w1 = res && res.team1Score > res.team2Score, w2 = res && res.team2Score > res.team1Score;
          h += `<div class="tv-round${res ? ' done' : (rIdx === curRound ? ' pending' : '')}">
            <div class="tv-round-label">Erä ${rIdx + 1}${pair.resting ? ` · ${esc(pair.resting)} lepää` : ''}</div>
            <div class="tv-team${w1 ? ' win' : ''}"><span>${teamStr(pair.team1)}</span><span class="sc">${res ? esc(res.team1Score) : ''}</span></div>
            <div class="tv-team${w2 ? ' win' : ''}"><span>${teamStr(pair.team2)}</span><span class="sc">${res ? esc(res.team2Score) : ''}</span></div>
          </div>`;
        });
        return h + '</div>';
      }).join('');

      const rEl = $('tvStandings');
      rEl.style.gridTemplateColumns = `repeat(${slice.length <= 1 ? 1 : 2}, minmax(0, 1fr))`;
      $('tvRightTitle').textContent = st.completed ? 'Sijoitus · siirrot' : 'Sijoitus · ennuste';
      const byCourt = computeEventStandingsByCourt(d);
      const proj = projectedCourtMap(d);
      const restLive = computeRestCountsLive(d);
      let stHtml = '';
      slice.forEach(court => {
        const players = byCourt[court.courtNumber];
        if (!players || !players.length) return;
        stHtml += `<div class="tv-court-standings"><div class="tv-court-standings-title">K${court.courtNumber}</div>
          <table class="tv-table"><thead><tr><th>#</th><th>Nimi</th><th class="tv-num" title="Voitot–tasapelit–häviöt">VTH</th><th class="tv-num">Taso</th><th class="tv-rest" title="Taukojen määrä">L</th><th class="tv-mv" title="Ennustettu siirto">↕</th></tr></thead><tbody>`;
        players.forEach((s, i) => {
          stHtml += `<tr class="${i === 0 && players.length > 1 ? 'top' : ''}">
            <td>${i + 1}</td><td>${esc(s.name)}</td>
            <td class="tv-num">${s.played > 0 ? recordStr(s) : '–'}</td>
            <td class="tv-num">${ratingLabel(s.rating)}</td>
            <td class="tv-rest">${restLive[s.name] || '·'}</td>
            <td class="tv-mv">${moveBadge(court.courtNumber, proj ? proj[s.name] : null, true)}</td></tr>`;
        });
        stHtml += `</tbody></table></div>`;
      });
      rEl.innerHTML = stHtml;

      const keys = [];
      (d.rounds || []).forEach((rd, r) => Object.keys(rd?.results || {}).forEach(c => keys.push(`${cycleCount}-${r}-${c}`)));
      if (tvSeen === null) tvSeen = new Set(keys);
      else keys.forEach(k => {
        if (!tvSeen.has(k)) {
          tvSeen.add(k);
          const [, r, c] = k.split('-').map(Number);
          showTVFlash(d, r, c);
        }
      });
    }

    function initFromUrl() {
      const tv = URL_PARAMS.get('tv') === '1';
      if (tv) { initTVMode(); return; }
      const eventCode = normalizeCode(URL_PARAMS.get('event'));
      const adminCode = normalizeCode(URL_PARAMS.get('admin'));
      const goHome = () => { showView('view-home'); renderHome(); };

      if (adminCode) {
        (async () => {
          showLoading('Avataan hallintaa...');
          try {
            const res = await resolveEventCode(adminCode);
            if (!res || res.role !== 'organizer') { hideLoading(); notify('Hallintakoodia ei löytynyt.'); goHome(); return; }
            await claimOrganizer(res.eventId, adminCode);
            const entry = getEventEntry(res.eventId);
            currentRole = 'organizer';
            currentPlayerName = (entry && entry.myPlayerName) || null;
            currentOrganizerCode = adminCode;
            // Poistetaan hallintakoodi osoiterivistä (enterEvent asettaa ?event=)
            await enterEvent(res.eventId, res.eventData);
          } catch (e) { hideLoading(); notify('Virhe: ' + e.message); goHome(); }
        })();
        return;
      }
      if (eventCode) {
        (async () => {
          showLoading('Avataan tapahtumaa...');
          try {
            const data = await loadEvent(eventCode);
            if (!data) { hideLoading(); notify('Tapahtumaa ei löytynyt.'); goHome(); return; }
            const entry = getEventEntry(eventCode);
            currentRole = (entry && entry.role) || 'player';
            currentPlayerName = (entry && entry.myPlayerName) || null;
            currentOrganizerCode = (entry && entry.organizerCode) || null;
            await enterEvent(eventCode, data);
            if (!currentPlayerName && currentRole !== 'organizer') askIdentify();
          } catch (e) { hideLoading(); notify('Virhe: ' + e.message); goHome(); }
        })();
        return;
      }
      goHome();
    }

    async function main() {
      if (LOCAL_MODE) {
        $('localBanner').classList.remove('hidden');
        document.title = '3 Erää (paikallinen)';
      }
      let authOk = false;
      for (let attempt = 0; attempt < 3; attempt++) {
        try { await backend.ensureAuth(); authOk = true; break; }
        catch (e) {
          console.warn('Auth attempt failed', attempt, e);
          await new Promise(r => setTimeout(r, 500 * (attempt + 1)));
        }
      }
      if (!authOk) {
        document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;">' +
          '<h2 style="color:#c62828;">Yhteyttä ei saatu</h2>' +
          '<p style="color:#5a6172;">Kirjautuminen Firebaseen epäonnistui. Tarkista verkkoyhteys ja lataa sivu uudelleen.</p>' +
          '<button onclick="location.reload()" style="padding:12px 24px;font-size:1rem;border-radius:12px;border:none;background:#3d55f5;color:#fff;font-weight:700;cursor:pointer;margin-top:16px;">Lataa uudelleen</button>' +
          '</div>';
        return;
      }
      try {
        const num = parseFloat(localStorage.getItem('APP_ui_zoom') || '0');
        if (!isNaN(num)) applyUiScale(num);
      } catch (e) {}
      updateThemeColorMeta();
      attachShellHandlers();
      initViewportHelpers();
      initConnection();
      registerSW();
      initFromUrl();
    }

    main();
  </script>
</body>
</html>
