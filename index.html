<!DOCTYPE html>
<!--
  3 Erää - Turnausjärjestelmä
  Versio: 4.4.0

  v4.4: Pelaajat-näkymässä pelaajaa voi raahata vasta, kun se on ensin valittu napauttamalla (puhelimessa
        vieritys ei enää siirrä pelaajia vahingossa).
        Ylätunniste: tapahtumassa ei enää paluunuolta (poistuminen: Minä → Poistu tai Hallinta → Poistu).
        QR-koodinappi näkyy myös pelaajille, jotta tapahtuman voi jakaa eteenpäin.
        Sijoitus on vieritettävä lista sivutuksen sijaan (otsikkorivi pysyy paikallaan).
        TV-näkymän oikeassa yläkulmassa on sulkuruksi.

  v4.3: Hallinnassa voi muokata pelaajan nimeä (Hallinta → Pelaajan nimi, tai Pelaajat-näkymässä valitun
        pelaajan "Muokkaa nimeä"). Nimi vaihtuu kaikkialle historiaa myöten, ja pelaajan omalla laitteella
        valinta seuraa uuteen nimeen.
        Suuri zoom / kapea näyttö: otsikot lyhenevät (Erä 1 → E1, Kenttä 1 → K1), pelaajien nimet näkyvät
        aina kokonaan (rivittyvät, ei katkaisua), sijoitustaulukossa nimi omalla rivillään ja luvut sen alla.
        Jos sisältö ei mahdu näytölle, näkymä vierii eikä elementtejä rutisteta.

  v4.2: Järjestäjän Pelaajat-näkymässä pelaajia voi raahata kentältä toiselle (hiiri ja kosketus).
        Pudotus toisen pelaajan päälle vaihtaa paikat; pudotus kentän tyhjään kohtaan siirtää
        pelaajan kentän viimeiseksi ja välissä olevien kenttien pelaajat siirtyvät yhden paikan.
        Napauta ja vaihda toimii kuten ennen.

  v4.1: Aloitustaso näkyy taas: Sijoitus (alku-luku tason alla), Minä ja Historia.
        Uusissa tapahtumissa saman aloituskentän pelaajilla on sama aloitustaso (seedByCourt),
        koska kentän sisäistä paremmuutta ei alussa tiedetä; kenttien välinen ero säilyy.
        Hallinnassa voi vaihtaa tapahtuman nimen. Oletuszoom 25 % suurempi, säätö -30 % … +40 %.

  v4.0: Täysin uusi käyttöliittymä (mobiili ensin, ei rullausta):
        - Sovellus täyttää aina yhden näytön: yläpalkki, yksi tehtävä kerrallaan, alanavigaatio.
        - Pelaaja: "Peli" (oma erä ja tuloksen syöttö yhdellä näkymällä), "Kentät" (kaikki kentät
          ruudukkona, napautus avaa kentän), "Sijoitus" (kenttä kerrallaan tai kaikki, sivutus),
          "Minä" (oma historia, nimen vaihto, asetukset).
        - Järjestäjä: "Kierros" (tilannekuva, kenttäruudukko ja kierroksen päättäminen),
          "Sijoitus", "Pelaajat" (napauta ja vaihda -kenttäjako, lisäys ja poisto),
          "Hallinta" (jako/QR, koodit, TV, historia, poisto).
        - Liittyminen yhdellä koodikentällä (tunnistaa pelaaja- ja järjestäjäkoodin).
        - Tapahtuman luonti kahdessa vaiheessa; järjestäjän ei ole pakko pelata.
        - Pitkät listat sivutetaan näytön korkeuden mukaan vierityksen sijaan.
        Tietomalli, Firebase-säännöt, turnauslogiikka (PURE-LOGIC) ja TV-näkymä ennallaan.

  v3.0: Uusi pisteytys: tasapelit sallittu (½ voittoa), nousijat ja putoajat ratkaistaan koko tapahtuman
        luokituksella (huomioi parit ja vastustajat), alkujärjestys kevyenä lähtötietona, reaaliaikainen
        sijoitus- ja TV-näkymä ennustetuin siirroin.

  v2.1: Käyttöliittymän modernisointi (mobiili ensin), PWA (manifest + service worker).

  Tietokantakerros (backend): Firebase tai paikallinen testitila. Localhostissa / file://-osoitteessa
  sovellus käyttää automaattisesti selaimen localStoragea ilman Firebasea. ?local=1 pakottaa
  paikallisen tilan, ?local=0 pakottaa Firebasen. ?latency=800 lisää viivettä testeihin.
-->
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f3f4f8">
  <meta name="color-scheme" content="light dark">
  <title>3 Erää</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('APP_ui_theme') || 'auto';
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        // Zoom: 0 % = oletus (1,25 × peruskoko), säätö -30 % … +40 %. Vanha APP_ui_scale-asetus ei siirry.
        var num = parseFloat(localStorage.getItem('APP_ui_zoom') || '0');
        var adj = isNaN(num) ? 0 : Math.max(-30, Math.min(40, Math.round(num / 5) * 5));
        document.documentElement.style.setProperty('--text-scale', String(1.25 * (100 + adj) / 100));
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      color-scheme: light dark; --text-scale: 1;
      --bg: #f3f4f8; --surface: #ffffff; --surface-2: #eef0f5; --surface-3: #e3e6ee;
      --text: #151827; --text-muted: #5d6478; --text-faint: #8a90a2;
      --border: #e2e5ec; --border-strong: #cfd3dd;
      --primary: #3d55f5; --primary-soft: #e9ecff; --primary-strong: #2236c9; --on-primary: #ffffff;
      --danger: #d32f2f; --danger-soft: #fdecec;
      --win: #12813e; --win-soft: #e2f6e9;
      --loss: #c62828; --loss-soft: #fdeaea;
      --warn: #8a5a00; --warn-soft: #fff3dc; --warn-border: #f5d48f;
      --rest: #9a5b00; --rest-soft: #fff1d6;
      --shadow: 0 1px 2px rgba(16,24,40,0.06), 0 1px 3px rgba(16,24,40,0.05);
      --shadow-lg: 0 10px 30px rgba(16,24,40,0.18);
      --radius: 16px; --radius-sm: 11px;
      --nav-h: 62px; --top-h: 52px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d0f15; --surface: #171a23; --surface-2: #1f2330; --surface-3: #2a2f3e;
        --text: #eceef4; --text-muted: #a0a7b8; --text-faint: #6f7689;
        --border: #272c3a; --border-strong: #363c4d;
        --primary: #7f8cff; --primary-soft: #1d2342; --primary-strong: #a9b2ff; --on-primary: #0d0f15;
        --danger: #ff6b6b; --danger-soft: #3a1717;
        --win: #6fdc98; --win-soft: #143221;
        --loss: #ff8080; --loss-soft: #3a1818;
        --warn: #ffd27a; --warn-soft: #33270e; --warn-border: #6b5010;
        --rest: #ffc864; --rest-soft: #33270e;
        --shadow: 0 1px 2px rgba(0,0,0,0.4); --shadow-lg: 0 10px 30px rgba(0,0,0,0.6);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0d0f15; --surface: #171a23; --surface-2: #1f2330; --surface-3: #2a2f3e;
      --text: #eceef4; --text-muted: #a0a7b8; --text-faint: #6f7689;
      --border: #272c3a; --border-strong: #363c4d;
      --primary: #7f8cff; --primary-soft: #1d2342; --primary-strong: #a9b2ff; --on-primary: #0d0f15;
      --danger: #ff6b6b; --danger-soft: #3a1717;
      --win: #6fdc98; --win-soft: #143221;
      --loss: #ff8080; --loss-soft: #3a1818;
      --warn: #ffd27a; --warn-soft: #33270e; --warn-border: #6b5010;
      --rest: #ffc864; --rest-soft: #33270e;
      --shadow: 0 1px 2px rgba(0,0,0,0.4); --shadow-lg: 0 10px 30px rgba(0,0,0,0.6);
      color-scheme: dark;
    }
    :root[data-theme="light"] { color-scheme: light; }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: calc(16px * var(--text-scale)); -webkit-text-size-adjust: 100%; height: 100%; }
    body {
      margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.35; overscroll-behavior: none;
    }
    .hidden { display: none !important; }
    button { font: inherit; color: inherit; }
    input, select, textarea { font: inherit; color: var(--text); }
    .ic { width: 1.25em; height: 1.25em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

    /* ===== Sovelluksen runko: aina täsmälleen yksi näyttö ===== */
    .app { position: fixed; inset: 0; display: flex; flex-direction: column; height: 100dvh; padding-top: env(safe-area-inset-top); }
    .topbar {
      flex: 0 0 var(--top-h); display: flex; align-items: center; gap: 4px; padding: 0 6px;
      background: var(--surface); border-bottom: 1px solid var(--border); position: relative; z-index: 5;
    }
    .topbar .tb-title { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 4px; }
    .tb-name { font-weight: 800; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
    .tb-sub { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tb-progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: transparent; }
    .tb-progress span { display: block; height: 100%; background: var(--primary); transition: width .4s ease; border-radius: 0 3px 3px 0; }
    .icon-btn {
      width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: inline-flex;
      align-items: center; justify-content: center; cursor: pointer; color: var(--text); flex: 0 0 auto; padding: 0;
    }
    .icon-btn:active { background: var(--surface-2); }
    .icon-btn .ic { width: 24px; height: 24px; }
    .conn { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; margin: 0 6px; flex: 0 0 auto; box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
    .conn.wait { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.2); }
    .conn.off { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.2); animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .local-banner { flex: 0 0 auto; background: var(--warn-soft); color: var(--warn); font-size: 0.72rem; font-weight: 700; text-align: center; padding: 3px 8px; }

    .main { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }
    .view { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 12px 14px; gap: 10px; min-height: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    /* Jos sisältö ei mahdu (esim. suuri zoom), näkymä vierii – elementtejä ei rutisteta. */
    .view > * { flex-shrink: 0; }
    .pane { flex: 1 0 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
    .grow { flex: 1 1 auto; min-height: 0; }
    .scroll-y { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .view > .grow.scroll-y { flex: 1 1 0; min-height: 8rem; }

    .bottom-nav {
      flex: 0 0 auto; display: flex; background: var(--surface); border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom); z-index: 5;
    }
    .nav-item {
      flex: 1; height: var(--nav-h); border: 0; background: transparent; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px; font-size: 0.72rem; font-weight: 600; color: var(--text-muted); cursor: pointer; position: relative; padding: 0;
    }
    .nav-item .ic { width: 24px; height: 24px; }
    .nav-item > span:not(.badge) { font-size: min(1em, 3.3vw); white-space: nowrap; }
    .nav-item.active { color: var(--primary); }
    .nav-item.active::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--primary); }
    .nav-item .badge { position: absolute; top: 7px; left: calc(50% + 8px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 0.66rem; line-height: 17px; font-weight: 800; }
    body.kb-open .bottom-nav { display: none; }

    /* ===== Peruskomponentit ===== */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); min-height: 0; }
    .card.tight { padding: 10px 12px; }
    h1, h2, h3 { margin: 0; letter-spacing: -0.015em; }
    h1 { font-size: 1.8rem; font-weight: 850; }
    h2 { font-size: 1.15rem; font-weight: 800; }
    h3 { font-size: 0.95rem; font-weight: 800; }
    .muted { color: var(--text-muted); }
    .faint { color: var(--text-faint); }
    .small { font-size: 0.82rem; }
    .tiny { font-size: 0.72rem; }
    .row { display: flex; align-items: center; gap: 8px; }
    .between { justify-content: space-between; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .center { text-align: center; }
    .label { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 18px;
      border-radius: 14px; border: 0; background: var(--primary); color: var(--on-primary); font-weight: 750; font-size: 1rem;
      cursor: pointer; width: 100%; transition: transform .08s ease, opacity .15s; text-align: center; line-height: 1.15;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: .45; cursor: default; transform: none; }
    .btn.big { min-height: 58px; font-size: 1.08rem; }
    .btn.sm { min-height: 40px; font-size: 0.88rem; padding: 0 12px; border-radius: 11px; width: auto; }
    .btn.ghost { background: var(--surface-2); color: var(--text); }
    .btn.outline { background: transparent; color: var(--text); border: 1.5px solid var(--border-strong); }
    .btn.danger { background: var(--danger); color: #fff; }
    .btn.danger-ghost { background: var(--danger-soft); color: var(--danger); }
    .btn.success { background: var(--win); color: #fff; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row > .btn { flex: 1; }
    .btn-row.wrap, .compact .btn-row { flex-wrap: wrap; }
    .btn-row.wrap > .btn, .compact .btn-row > .btn { flex: 1 1 auto; width: auto; }

    .field { width: 100%; min-height: 50px; padding: 12px 14px; border-radius: 13px; border: 1.5px solid var(--border-strong); background: var(--surface); font-size: 1rem; outline: none; }
    .field:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    textarea.field { resize: none; line-height: 1.45; }
    .code-input { text-align: center; letter-spacing: .35em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; text-transform: uppercase; font-size: 1.35rem; }
    .error { color: var(--danger); font-size: 0.85rem; font-weight: 600; margin: 0; min-height: 1.1em; }

    .seg { display: flex; background: var(--surface-2); border-radius: 13px; padding: 3px; gap: 3px; flex: 0 0 auto; }
    .seg button { flex: 1; min-height: 38px; border: 0; background: transparent; border-radius: 10px; font-weight: 700; font-size: 0.88rem; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 0 6px; white-space: nowrap; }
    .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
    .seg button .st { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); }
    .seg button .st.done { background: var(--win); }
    .seg button .st.cur { background: var(--primary); }

    .chips { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; flex: 0 0 auto; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; min-height: 36px; padding: 0 13px; border-radius: 18px; border: 1.5px solid var(--border-strong); background: var(--surface); font-weight: 700; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; color: var(--text); }
    .chip.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
    .chip.me:not(.on) { border-color: var(--primary); color: var(--primary); }

    .pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; background: var(--surface-2); color: var(--text-muted); white-space: nowrap; }
    .pill.win { background: var(--win-soft); color: var(--win); }
    .pill.loss { background: var(--loss-soft); color: var(--loss); }
    .pill.tie { background: var(--surface-3); color: var(--text-muted); }
    .pill.rest { background: var(--rest-soft); color: var(--rest); }
    .pill.primary { background: var(--primary-soft); color: var(--primary); }
    .up { color: var(--win); font-weight: 800; }
    .down { color: var(--loss); font-weight: 800; }
    .stay { color: var(--text-faint); font-weight: 700; }

    .dots { display: inline-flex; gap: 4px; }
    .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); display: block; }
    .dots i.done { background: var(--win); }
    .dots i.cur { background: var(--primary); }

    .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; color: var(--text-muted); padding: 20px; }
    .empty .big-ic { width: 64px; height: 64px; border-radius: 20px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; }
    .empty .big-ic .ic { width: 32px; height: 32px; }
    .empty h2 { color: var(--text); }

    /* ===== Koti ===== */
    .home-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 6px 0 2px; }
    .logo { width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(135deg, var(--primary), #8b5cf6); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.7rem; box-shadow: var(--shadow-lg); margin-bottom: 6px; }
    .recent-list { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
    .recent { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 13px; background: var(--surface-2); cursor: pointer; border: 0; width: 100%; text-align: left; }
    .recent .r-main { flex: 1; min-width: 0; }
    .recent .r-name { font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .recent .r-meta { font-size: 0.78rem; color: var(--text-muted); }
    .role-tag { font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 6px; background: var(--primary-soft); color: var(--primary); }
    .role-tag.org { background: var(--warn-soft); color: var(--warn); }

    /* ===== Luonti ===== */
    .steps { display: flex; gap: 6px; }
    .steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-3); }
    .steps i.on { background: var(--primary); }
    .count-badge { white-space: nowrap; font-size: 0.78rem; font-weight: 800; padding: 3px 9px; border-radius: 8px; background: var(--surface-2); color: var(--text-muted); }
    .count-badge.ok { background: var(--win-soft); color: var(--win); }
    .count-badge.bad { background: var(--loss-soft); color: var(--loss); }
    .toggle-line { display: flex; gap: 12px; align-items: center; padding: 10px 12px; background: var(--surface-2); border-radius: 13px; cursor: pointer; }
    .toggle-line input { width: 22px; height: 22px; accent-color: var(--primary); flex: 0 0 auto; }

    /* Nimivalinta (ruudukko) */
    .name-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 6em), 1fr)); gap: 6px; align-content: start; }
    .name-btn { min-height: 44px; border-radius: 12px; border: 1.5px solid var(--border-strong); background: var(--surface); font-weight: 700; font-size: 0.9rem; cursor: pointer; padding: 4px 6px; overflow-wrap: break-word; line-height: 1.2; }
    .name-btn.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
    .name-btn.alt { border-style: dashed; color: var(--text-muted); }
    .group-label { font-size: 0.72rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin: 8px 0 4px; }
    .group-label:first-child { margin-top: 0; }

    /* ===== Peli: oma erä ===== */
    .court-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: 0 0 auto; }
    .court-no { display: flex; align-items: baseline; gap: 8px; }
    .court-no .k { font-size: 0.78rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: .07em; }
    .court-no .n { font-size: 2rem; font-weight: 900; line-height: 1; color: var(--primary); }
    .banner { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 13px; font-size: 0.88rem; font-weight: 650; flex: 0 0 auto; }
    .banner .ic { width: 20px; height: 20px; }
    .banner.up { background: var(--win-soft); color: var(--win); }
    .banner.down { background: var(--loss-soft); color: var(--loss); }
    .banner.info { background: var(--primary-soft); color: var(--primary); }
    .banner.rest { background: var(--rest-soft); color: var(--rest); }
    .banner.ok { background: var(--win-soft); color: var(--win); }

    .match { flex: 1 0 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
    .sheet .match { flex: 0 0 auto; }
    .sheet .match .team { flex: 0 0 auto; min-height: 92px; }
    .team {
      flex: 1 0 auto; min-height: 0; max-height: none; display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: var(--radius); background: var(--surface); border: 1.5px solid var(--border);
    }
    .team.mine { border-color: var(--primary); background: var(--primary-soft); }
    .team.won { border-color: var(--win); }
    .team { flex-wrap: wrap; }
    .team .t-names { flex: 1 1 0; min-width: auto; max-width: 100%; display: flex; flex-direction: column; gap: 1px; }
    .team .stepper, .team .t-score { margin-left: auto; }
    .team .t-names b { font-size: 1.15rem; font-weight: 800; line-height: 1.2; overflow-wrap: break-word; }
    .team .t-tag { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--primary); }
    .team .t-score { font-size: 2.6rem; font-weight: 900; font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: right; line-height: 1; }
    .vs { text-align: center; font-size: 0.72rem; font-weight: 800; color: var(--text-faint); letter-spacing: .12em; flex: 0 0 auto; margin: -2px 0; }
    .stepper { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    .step {
      width: 48px; height: 48px; border-radius: 14px; border: 0; background: var(--surface-2); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text);
    }
    .team.mine .step { background: var(--surface); }
    .step:active { transform: scale(0.94); background: var(--surface-3); }
    .step .ic { width: 22px; height: 22px; stroke-width: 2.6; }
    .score-in {
      width: 64px; height: 56px; border-radius: 14px; border: 2px solid var(--border-strong); background: var(--surface); text-align: center;
      font-size: 1.9rem; font-weight: 900; font-variant-numeric: tabular-nums; padding: 0; -moz-appearance: textfield; outline: none;
    }
    .score-in:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .score-in::-webkit-outer-spin-button, .score-in::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .rest-line { font-size: 0.85rem; color: var(--text-muted); text-align: center; flex: 0 0 auto; }
    .hint { font-size: 0.82rem; color: var(--text-muted); text-align: center; min-height: 1.1em; flex: 0 0 auto; margin: 0; }
    .hint.err { color: var(--danger); font-weight: 650; }

    .summary-big { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; flex: 1 0 auto; min-height: 0; }
    .summary-big .ring { width: 74px; height: 74px; border-radius: 50%; background: var(--win-soft); color: var(--win); display: flex; align-items: center; justify-content: center; }
    .summary-big .ring .ic { width: 38px; height: 38px; stroke-width: 2.6; }
    .summary-big.rest .ring { background: var(--rest-soft); color: var(--rest); }
    .mini-games { display: flex; flex-direction: column; gap: 6px; width: 100%; }
    .mini-game { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); font-size: 0.86rem; text-align: left; border: 0; width: 100%; cursor: pointer; }
    .mini-game .mg-e { font-weight: 800; color: var(--text-muted); width: 2.2em; flex: 0 0 auto; }
    .mini-game .mg-t { flex: 1; min-width: 0; overflow-wrap: break-word; }
    .mini-game .mg-s { font-weight: 850; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .stat-trio { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
    .stat-trio > .stat { flex: 1 1 0; min-width: max-content; }
    .stat { background: var(--surface-2); border-radius: 13px; padding: 9px 6px; text-align: center; }
    .stat b { display: block; font-size: 1.3rem; font-weight: 900; line-height: 1.15; white-space: nowrap; }
    .stat span { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }

    /* ===== Kenttäruudukko ===== */
    .court-grid { flex: 1 0 auto; min-height: 0; display: grid; gap: 8px; grid-auto-rows: minmax(min-content, 1fr); }
    .tile {
      min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 10px 11px; border-radius: var(--radius);
      background: var(--surface); border: 1.5px solid var(--border); text-align: left; cursor: pointer; box-shadow: var(--shadow); width: 100%;
    }
    .tile:active { transform: scale(0.985); }
    .tile.mine { border-color: var(--primary); }
    .tile.done { background: var(--win-soft); border-color: transparent; }
    .tile .tl-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .tile .tl-no { font-weight: 900; font-size: 1.05rem; white-space: nowrap; }
    .tile .tl-body { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 1px; font-size: 0.82rem; line-height: 1.25; }
    .tile .tl-body .tm { overflow-wrap: break-word; font-weight: 650; }
    .tile .tl-body .tv { font-size: 0.66rem; color: var(--text-faint); font-weight: 800; letter-spacing: .1em; }
    .tile .tl-foot { font-size: 0.72rem; color: var(--text-muted); font-weight: 700; overflow-wrap: break-word; }
    .tile.done .tl-foot { color: var(--win); }

    .status-card { display: flex; align-items: center; gap: 14px; flex: 0 0 auto; }
    .ring-prog { --p: 0; width: 64px; height: 64px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
      background: conic-gradient(var(--primary) calc(var(--p) * 1%), var(--surface-3) 0); }
    .ring-prog > span { width: 50px; height: 50px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.9rem; }
    .ring-prog.done { background: conic-gradient(var(--win) 100%, var(--win) 0); }
    .waiting-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

    /* ===== Taulukot ja listat ===== */
    .list { flex: 1 0 0; min-height: 10rem; display: flex; flex-direction: column; overflow: hidden; }
    .list-rows { flex: 1 1 auto; min-height: 0; overflow: auto; }
    .scroll-list .list-rows { position: relative; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    .lrow { display: grid; align-items: center; column-gap: 8px; padding: 4px 8px; min-height: 42px; border-bottom: 1px solid var(--border); font-size: 0.9rem; flex: 0 0 auto; }
    .lrow:last-child { border-bottom: 0; }
    .lrow.head { min-height: 30px; font-size: 0.68rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
    .lrow.me { background: var(--primary-soft); border-radius: 10px; border-bottom-color: transparent; }
    .lrow .pos { font-weight: 850; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .lrow .nm { font-weight: 750; min-width: 0; }
    .lrow .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .lrow.head > span { white-space: nowrap; }
    .lrow .sub { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
    .lrow .num .sub, .stat small { font-size: 0.66rem; }
    .stat small { display: block; color: var(--text-muted); font-weight: 700; }
    /* Sarakeleveydet rem-yksiköissä, jotta otsikko- ja datarivit linjautuvat. Nimi rivittyy tarvittaessa. */
    .g-court { grid-template-columns: 1.3rem minmax(0,1fr) 3rem 3.1rem 2.7rem; }
    .g-all { grid-template-columns: 1.6rem minmax(0,1fr) 1.7rem 3rem 3.1rem; }
    .g-rate { grid-template-columns: 1.6rem minmax(0,1fr) 2.6rem 3rem 2.6rem; }
    .g-hist { grid-template-columns: 1.8rem minmax(0,1fr) 3rem 2.7rem; }
    .lrow .nm, .lrow .nm .sub { overflow-wrap: break-word; }
    /* Tiivis tila: nimi omalle rivilleen koko leveydelle, luvut sen alle omiin sarakkeisiinsa. */
    .compact .lrow:not(.head) { row-gap: 0; }
    .compact .lrow:not(.head) > .pos { grid-row: 1 / span 2; }
    .compact .lrow:not(.head) > .nm { grid-column: 2 / -1; grid-row: 1; }
    .compact .lrow:not(.head) > .num { grid-row: 2; }
    .compact .lrow > .num:nth-child(3) { grid-column: 3; }
    .compact .lrow > .num:nth-child(4) { grid-column: 4; }
    .compact .lrow > .num:nth-child(5) { grid-column: 5; }
    .compact .view { padding-left: 10px; padding-right: 10px; }
    .compact .lrow { column-gap: 6px; padding: 4px 6px; }
    .compact .lrow .num { font-size: 0.9em; }
    .compact .lg { display: none; }
    .lrow .sub.hc { display: none; }
    .compact .lrow .sub.hc { display: block; }
    .pager { display: flex; align-items: center; justify-content: center; gap: 10px; flex: 0 0 auto; padding-top: 6px; }
    .pager .pg { font-size: 0.8rem; font-weight: 750; color: var(--text-muted); min-width: 4em; text-align: center; }
    .pager .icon-btn { width: 40px; height: 36px; background: var(--surface-2); }
    .pager .icon-btn:disabled { opacity: .35; }

    /* ===== Pelaajat (järjestäjä) ===== */
    .pm-grid { flex: 1 0 auto; min-height: 0; display: grid; gap: 8px; grid-auto-rows: minmax(min-content, 1fr); }
    .pm-court { min-height: 0; min-width: 0; border-radius: var(--radius); background: var(--surface); border: 1.5px solid var(--border); padding: 7px 8px; display: flex; flex-direction: column; gap: 4px; }
    .pm-court.reset { border-color: var(--warn-border); background: var(--warn-soft); }
    .pm-court .pm-h { display: flex; align-items: center; justify-content: space-between; gap: 4px; font-weight: 850; font-size: 0.85rem; }
    .pm-chips { display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }
    .pchip { min-height: 30px; padding: 0 10px; border-radius: 10px; border: 1.5px solid var(--border-strong); background: var(--surface-2); font-weight: 700; font-size: 0.82rem; cursor: pointer; max-width: 100%; overflow-wrap: break-word; text-align: left; line-height: 1.2; padding-top: 3px; padding-bottom: 3px; }
    .pchip.sel { background: var(--primary); color: var(--on-primary); border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .pchip.new { border-style: dashed; border-color: var(--win); }
    .pchip.target { border-color: var(--primary); }
    .pchip { touch-action: pan-x pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .pchip.sel { touch-action: none; cursor: grab; }
    .pchip.dragging { opacity: .35; }
    .pchip.drop { background: var(--primary-soft); border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .pm-court.drop { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .pchip-ghost { position: fixed; left: 0; top: 0; z-index: 80; pointer-events: none; margin: 0; background: var(--primary); color: var(--on-primary); border-color: var(--primary); box-shadow: 0 8px 24px rgba(0,0,0,.25); transform-origin: center; opacity: .95; }
    .action-bar { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; }

    /* ===== Hallinta ===== */
    .launch { flex: 1 0 auto; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; grid-auto-rows: minmax(min-content, 1fr); }
    .launch-btn { min-height: 0; border-radius: var(--radius); border: 1.5px solid var(--border); background: var(--surface); display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 12px; gap: 6px; cursor: pointer; text-align: left; box-shadow: var(--shadow); min-width: 0; overflow-wrap: break-word; }
    .compact .launch { grid-template-columns: 1fr; }
    .compact .launch-btn { flex-direction: row; align-items: center; justify-content: flex-start; padding: 10px 12px; }
    .compact .launch-btn .lb-ic { flex: 0 0 auto; }
    .launch-btn .lb-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; }
    .launch-btn .lb-ic .ic { width: 22px; height: 22px; }
    .launch-btn b { font-size: 0.95rem; font-weight: 800; }
    .launch-btn span { font-size: 0.74rem; color: var(--text-muted); line-height: 1.25; }
    .launch-btn.danger .lb-ic { background: var(--danger-soft); color: var(--danger); }
    .launch-btn.warn .lb-ic { background: var(--warn-soft); color: var(--warn); }
    .launch-btn:active { transform: scale(0.98); }
    .codes-row { display: flex; flex-wrap: wrap; gap: 8px; flex: 0 0 auto; }
    .codes-row > .code-box { flex: 1 1 0; min-width: max-content; }
    .code-box { border-radius: var(--radius); padding: 10px 12px; background: var(--surface); border: 1.5px solid var(--border); cursor: pointer; text-align: left; }
    .code-box.org { background: var(--warn-soft); border-color: var(--warn-border); }
    .code-box .cv { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1.45rem; font-weight: 900; letter-spacing: .14em; }
    .code-box.org .cv, .code-box.org .label { color: var(--warn); }

    /* ===== Siirrot ===== */
    .mv-grid { flex: 1 0 auto; min-height: 0; display: grid; gap: 8px; grid-auto-rows: minmax(min-content, 1fr); }
    .mv-court { min-height: 0; min-width: 0; border-radius: var(--radius); background: var(--surface); border: 1.5px solid var(--border); padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
    .mv-court .mv-h { font-weight: 900; font-size: 0.9rem; margin-bottom: 2px; display: flex; justify-content: space-between; }
    .mv-p { display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 6px; font-size: 0.84rem; line-height: 1.35; }
    .mv-p b { font-weight: 700; overflow-wrap: break-word; min-width: auto; max-width: 100%; }
    .mv-p > span { white-space: nowrap; margin-left: auto; }

    /* ===== Alalaidan paneeli (sheet) ===== */
    .sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(8,10,20,0.45); animation: fadeIn .15s ease; }
    .sheet {
      background: var(--surface); border-radius: 22px 22px 0 0; max-height: calc(100dvh - 24px - env(safe-area-inset-top)); display: flex; flex-direction: column;
      padding: 6px 16px calc(14px + env(safe-area-inset-bottom)); box-shadow: var(--shadow-lg); animation: slideUp .2s ease; width: 100%; max-width: 640px; margin: 0 auto;
    }
    .sheet.full { height: calc(100dvh - 24px - env(safe-area-inset-top)); }
    .sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: var(--border-strong); margin: 4px auto 8px; flex: 0 0 auto; cursor: grab; touch-action: none; }
    .sheet-head { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; margin-bottom: 10px; }
    .sheet-head h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sheet-head .icon-btn { width: 38px; height: 38px; background: var(--surface-2); border-radius: 50%; }
    .sheet-head .icon-btn .ic { width: 20px; height: 20px; }
    .sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .sheet-foot { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; padding-top: 10px; }
    @keyframes slideUp { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .erä-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 13px; background: var(--surface-2); border: 0; width: 100%; text-align: left; cursor: pointer; }
    .erä-row.done { background: var(--win-soft); }
    .erä-row.cur { outline: 2px solid var(--primary); background: var(--primary-soft); }
    .erä-row .er-n { font-weight: 900; color: var(--text-muted); font-size: 0.72rem; min-width: 2.4em; flex: 0 0 auto; white-space: nowrap; }
    .erä-row { flex-wrap: wrap; }
    .erä-row .er-s { margin-left: auto; }
    .erä-row .er-t { flex: 1 1 0; min-width: auto; max-width: 100%; font-size: 0.9rem; font-weight: 650; line-height: 1.3; }
    .erä-row .er-t div { overflow-wrap: break-word; }
    .erä-row .er-s { font-size: 1.15rem; font-weight: 900; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .erä-row .er-s.pend { font-size: 0.8rem; color: var(--primary); font-weight: 800; }
    .qr-box { display: flex; justify-content: center; }
    .qr-box img { width: min(58vw, 240px); height: auto; image-rendering: pixelated; background: #fff; padding: 10px; border-radius: 14px; }
    .url-box { font-size: 0.75rem; color: var(--text-muted); word-break: break-all; text-align: center; background: var(--surface-2); padding: 8px; border-radius: 10px; }
    .radio-seg { display: flex; gap: 6px; }
    .radio-seg label { flex: 1; }
    .radio-seg input { display: none; }
    .radio-seg span { display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 12px; border: 1.5px solid var(--border-strong); font-weight: 700; cursor: pointer; }
    .radio-seg input:checked + span { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
    .size-ctl { display: flex; align-items: center; gap: 10px; }
    .size-ctl .v { flex: 1; text-align: center; font-weight: 800; font-size: 1.1rem; }
    .info-text { font-size: 0.88rem; color: var(--text-muted); line-height: 1.5; margin: 0; }

    /* ===== Ilmoitukset ja lataus ===== */
    #toastHost { position: fixed; left: 0; right: 0; top: calc(var(--top-h) + 8px + env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 200; pointer-events: none; padding: 0 12px; }
    .toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; background: #1d2130; color: #fff; padding: 11px 14px; border-radius: 14px; font-size: 0.9rem; font-weight: 600; box-shadow: var(--shadow-lg); max-width: 520px; width: max-content; animation: slideUp .2s ease; }
    .toast.success { background: #11733a; }
    .toast.error { background: #b42318; }
    .toast button { border: 0; background: rgba(255,255,255,.18); color: #fff; padding: 7px 12px; border-radius: 9px; font-weight: 800; cursor: pointer; }
    .loading { position: fixed; inset: 0; background: rgba(8,10,20,0.35); display: flex; align-items: center; justify-content: center; z-index: 300; }
    .loading-box { background: var(--surface); padding: 20px 26px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: var(--shadow-lg); font-weight: 650; }
    .spinner { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--surface-3); border-top-color: var(--primary); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (min-width: 700px) {
      .view { max-width: 640px; margin: 0 auto; }
    }
    @media (max-height: 640px) {
      :root { --nav-h: 56px; --top-h: 48px; }
      .view { padding: 8px 12px; gap: 8px; }
      .team .t-score { font-size: 2.1rem; }
      .btn.big { min-height: 52px; }
      .step { width: 44px; height: 44px; }
      .score-in { height: 50px; width: 58px; font-size: 1.6rem; }
    }

    /* ===== TV-tila ===== */
    body.tv-mode { background: #000; color: #fff; }
    body.tv-mode .app { display: none !important; }
    body.tv-mode #view-tv { display: block !important; }
    /* ===== TV-näkymä (vain vaaka) ===== */
    #view-tv { display: none; position: fixed; inset: 0; background: #0a0a0f; color: #fff; z-index: 1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
    body.tv-idle #view-tv { cursor: none; }
    #tvRotate { display: none; position: absolute; inset: 0; z-index: 5; background: #0a0a0f; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 6vw; font-weight: 800; }
    @media (orientation: portrait) { #tvRotate { display: flex; } .tv-wrap { visibility: hidden; } }
    .tv-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 1.4vh; padding: 1.6vh 1.4vw; }
    .tv-top { flex: 0 0 auto; display: flex; align-items: center; gap: 1.5vw; padding-bottom: 1vh; border-bottom: 2px solid #2a2a3a; }
    .tv-top-info { flex: 1; min-width: 0; }
    .tv-title { font-size: clamp(22px, 4.4vh, 64px); font-weight: 800; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; color: #fff; }
    .tv-status { font-size: clamp(16px, 2.6vh, 38px); color: #aab1c2; margin-top: 0.3vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tv-status strong { color: #9aa6ff; }
    .tv-qr { flex: 0 0 auto; text-align: center; margin-right: 16vh; }
    .tv-qr img { display: block; background: #fff; padding: 0.5vh; border-radius: 6px; height: 9.9vh; width: 9.9vh; object-fit: contain; }
    .tv-qr-label { font-size: 1.6vh; color: #aab1c2; margin-top: 0.3vh; }
    .tv-fs { position: absolute; top: 1.2vh; right: calc(1vw + 5.4vh); width: auto; min-height: 0; margin: 0; padding: 0.8vh 1.2vh; font-size: 1.8vh; background: #1f232e; color: #fff; border: 1px solid #3a4050; border-radius: 8px; opacity: 0.9; z-index: 6; }
    .tv-fs .ic { width: 2.4vh; height: 2.4vh; }
    .tv-close { position: absolute; top: 1.2vh; right: 1vw; width: 4.6vh; height: 4.6vh; min-width: 32px; min-height: 32px; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; background: #1f232e; color: #fff; border: 1px solid #3a4050; border-radius: 8px; opacity: 0.9; z-index: 6; cursor: pointer; }
    .tv-close .ic { width: 2.8vh; height: 2.8vh; min-width: 18px; min-height: 18px; }

    function encodeMap(o) { const r = {}; Object.keys(o || {}).forEach(k => { r[encKey(k)] = o[k]; }); return r; }
    function decodeMap(o) { const r = {}; Object.keys(o || {}).forEach(k => { r[decKey(k)] = o[k]; }); return r; }
    function getRestState(d) { return { restCounts: decodeMap(d && d.restCounts), lastRestCycle: decodeMap(d && d.lastRestCycle) }; }

    function isValidPlayerCount(n) {
      if (!Number.isInteger(n) || n < 4) return false;
      const N = Math.floor(n / 4);
      return (n - 4 * N) <= N;
    }

    // Kenttäkoot annetulle pelaajamäärälle; suosii aiempia 5 pelaajan kenttiä (pref)
    function sizesForCount(n, prefSizes = []) {
      if (!isValidPlayerCount(n)) return null;
      const N = Math.floor(n / 4), k = n - 4 * N;
      const order = Array.from({ length: N }, (_, i) => i).sort((a, b) => {

      });

    }

    function generateId() { let id = ''; for (let i = 0; i < 5; i++) id += ID_CHARS[Math.floor(Math.random() * ID_CHARS.length)]; return id; }
    function normalizeCode(s) { return String(s || '').trim().toUpperCase().replace(/\s+/g, ''); }
    function isValidCodeFormat(s) { return /^[A-Z0-9]{3,20}$/.test(s); }
    function capDiff(d) { return Math.sign(d) * Math.min(MAX_POINT_DIFF, Math.abs(d)); }
    function getCourtResult(eventData, r, c) { const rd = eventData?.rounds?.[r]; if (!rd || !rd.results) return null; return rd.results[c] || null; }
    function getRoundPairing(court, r) { return court?.rounds?.[r] || null; }

    // ---------- Kenttien ja taukojen logiikka ----------
    function getCombinations(arr, k) {
      if (k === 0) return [[]];
      if (k < 0 || arr.length < k) return [];
      const [first, ...rest] = arr;
      const withFirst = getCombinations(rest, k - 1).map(c => [first, ...c]);
      const withoutFirst = getCombinations(rest, k);
      return [...withFirst, ...withoutFirst];
    }

    function selectRestersForCycle(players, restCounts, lastRestCycle, lastCompletedCycleIndex) {
      const available = players.filter(p => (lastRestCycle[p] ?? -1000) !== lastCompletedCycleIndex);
      const recently = players.filter(p => (lastRestCycle[p] ?? -1000) === lastCompletedCycleIndex);
      const sortFn = (a, b) => {
        const ca = restCounts[a] || 0, cb = restCounts[b] || 0;
        if (ca !== cb) return ca - cb;
        const la = lastRestCycle[a] ?? -1000, lb = lastRestCycle[b] ?? -1000;
        if (la !== lb) return la - lb;
        return players.indexOf(a) - players.indexOf(b);
      };
      available.sort(sortFn);
      recently.sort(sortFn);
      return [...available, ...recently].slice(0, 3);
    }

    function generateCourtRounds4p(players) {
      const [a, b, c, d] = players;
      return [
        { roundIndex: 0, team1: [a, d], team2: [b, c], resting: null },
        { roundIndex: 1, team1: [a, c], team2: [b, d], resting: null },
        { roundIndex: 2, team1: [a, b], team2: [c, d], resting: null }
      ];
    }

    function generateCourtRounds5p(players, resters) {
      const [r0, r1, r2] = resters;
      const non = players.filter(p => !resters.includes(p));
      const [A, B] = non;
      return [
        { roundIndex: 0, team1: [A, r2], team2: [B, r1], resting: r0 },
        { roundIndex: 1, team1: [A, r0], team2: [B, r2], resting: r1 },
        { roundIndex: 2, team1: [A, B], team2: [r0, r1], resting: r2 }
      ];
    }

    function makeCourt(i, players, restCounts, lastRestCycle, lastCompletedCycleIndex) {
      let rounds, resters = [];
      if (players.length === 5) {
        resters = selectRestersForCycle(players, restCounts, lastRestCycle, lastCompletedCycleIndex);
        rounds = generateCourtRounds5p(players, resters);
      } else {
        rounds = generateCourtRounds4p(players);
      }
      return { courtIndex: i, courtNumber: i + 1, players, rounds, resters };
    }

    function computeInitialCourts(playerNames, restCounts = {}, lastRestCycle = {}, lastCompletedCycleIndex = -1) {
      const n = playerNames.length;
      let remaining = n;
      const sizes = [];
      while (remaining > 0) {
        if (remaining % 4 === 0) { sizes.push(4); remaining -= 4; }
        else { sizes.push(5); remaining -= 5; }
      }
      sizes.reverse();
      const courts = [];
      let idx = 0;
      for (let i = 0; i < sizes.length; i++) {
        const players = playerNames.slice(idx, idx + sizes[i]);
        idx += sizes[i];
        courts.push(makeCourt(i, players, restCounts, lastRestCycle, lastCompletedCycleIndex));
      }
      return courts;
    }

    // Pelaajalista kenttiin annetuilla koilla; muuttumattomien kenttien erät ja taukovuorot säilytetään
    function buildCourtsFromSizes(list, sizes, restState, lastCompletedCycleIndex, oldCourts = []) {
      let idx = 0;
      const courts = [], reused = [];
      sizes.forEach((size, i) => {
        const players = list.slice(idx, idx + size);
        idx += size;
        const old = oldCourts[i];
        const same = !!old && old.players.length === size && (old.rounds || []).length === 3 &&
          old.players.every(p => players.includes(p));
        if (same) {
          courts.push({ courtIndex: i, courtNumber: i + 1, players, rounds: old.rounds, resters: old.resters || [] });
        } else {
          courts.push(makeCourt(i, players, restState.restCounts, restState.lastRestCycle, lastCompletedCycleIndex));
        }
        reused.push(same);
      });
      return { courts, reused };
    }

    function planPlayerChanges(d, list) {
      const oldCourts = d.courts || [];
      const sizes = sizesForCount(list.length, oldCourts.map(c => c.players.length));
      if (!sizes) return null;
      const lastCompleted = (d.previousCycles || []).length - 1;
      const { courts, reused } = buildCourtsFromSizes(list, sizes, getRestState(d), lastCompleted, oldCourts);
      const oldRounds = d.rounds || [];
      const rounds = [0, 1, 2].map(r => ({ roundIndex: r, results: {} }));
      const resetCourts = [];
      courts.forEach((nc, i) => {
        const oc = oldCourts[i];
        if (!oc) return;
        let hadResults = false;
        for (let r = 0; r < 3; r++) {
          const oldRes = oldRounds[r]?.results?.[oc.courtIndex];
          if (!oldRes) continue;
          hadResults = true;
          if (reused[i]) rounds[r].results[nc.courtIndex] = oldRes;
        }
        if (hadResults && !reused[i]) resetCourts.push(nc.courtNumber);
      });
      return { courts, rounds, resetCourts };
    }

    // Rajasiirrot: palauttaa uudet listat ja siirtyneet pelaajat
    function boundaryExchangePlayers(oldCourts, standings) {
      const N = oldCourts.length;
      const rank = {};
      standings.forEach((s, i) => { rank[s.name] = i; });
      const sends = oldCourts.map(() => []);
      const receives = oldCourts.map(() => []);
      const moved = new Set();
      for (let i = 0; i < N - 1; i++) {
        const upper = oldCourts[i], lower = oldCourts[i + 1];
        const both5p = upper.players.length === 5 && lower.players.length === 5;
        const count = both5p ? 2 : 1;
        const upS = [...upper.players].sort((a, b) => (rank[a] ?? 999) - (rank[b] ?? 999));
        const loS = [...lower.players].sort((a, b) => (rank[a] ?? 999) - (rank[b] ?? 999));
        const drops = upS.slice(-count);
        const rises = loS.slice(0, count);
        sends[i].push(...drops); receives[i + 1].push(...drops);
        sends[i + 1].push(...rises); receives[i].push(...rises);
        drops.forEach(p => moved.add(p)); rises.forEach(p => moved.add(p));
      }
      const lists = oldCourts.map((c, i) => {
        const remaining = c.players.filter(p => !sends[i].includes(p));
        return [...remaining, ...receives[i]];
      });
      return { lists, moved };
    }

    // seed: (vanha kenttä, sija kentällä) -> vertailukelpoinen järjestys; moved-pelaajia ei siirretä uudelleen jos on vaihtoehto
    function rebalanceCourtSizes(lists, targetSizes, seed, moved = new Set()) {
      const N = lists.length;
      const working = lists.map(l => [...l]);
      const deltas = targetSizes.map((t, i) => t - working[i].length);
      const byBest = (a, b) => (seed[a] ?? 1e9) - (seed[b] ?? 1e9);
      const pick = (pool, count, fromBest) => {
        const stay = pool.filter(p => !moved.has(p)).sort(byBest);
        const mv = pool.filter(p => moved.has(p)).sort(byBest);
        const ordered = fromBest ? [...stay, ...mv] : [...stay.reverse(), ...mv.reverse()];
        return ordered.slice(0, count);
      };
      for (let i = 0; i < N - 1; i++) {
        if (deltas[i] > 0) {
          const need = deltas[i];
          const toMove = pick(working[i + 1], need, true);
          working[i + 1] = working[i + 1].filter(p => !toMove.includes(p));
          working[i].push(...toMove);
          deltas[i] -= need; deltas[i + 1] += need;
        } else if (deltas[i] < 0) {
          const excess = -deltas[i];
          const toMove = pick(working[i], excess, false);
          working[i] = working[i].filter(p => !toMove.includes(p));
          working[i + 1].push(...toMove);
          deltas[i] += excess; deltas[i + 1] -= excess;
        }
      }
      return working;
    }

    function determineTargetSizes(exchangedLists, N, seed, moved, restCounts, lastRestCycle, lastCompletedCycleIndex) {
      const n = exchangedLists.reduce((s, l) => s + l.length, 0);
      const k = n - 4 * N;
      if (k <= 0) return Array(N).fill(4);
      if (k >= N) return Array(N).fill(5);
      const combos = getCombinations(Array.from({ length: N }, (_, i) => i), k);
      let bestScore = -Infinity, bestSizes = null;
      for (const combo of combos) {
        const is5p = new Set(combo);
        const targetSizes = Array.from({ length: N }, (_, i) => is5p.has(i) ? 5 : 4);
        const rebalanced = rebalanceCourtSizes(exchangedLists, targetSizes, seed, moved);
        let score = 0, tiebreak = 0, hardViolations = 0;
        for (let i = 0; i < N; i++) {
          if (!is5p.has(i)) continue;
          const players = rebalanced[i];
          score += players.filter(p => !restCounts[p] || restCounts[p] === 0).length * 100;
          const hardOkCount = players.filter(p => (lastRestCycle[p] ?? -1000) !== lastCompletedCycleIndex).length;
          hardViolations += Math.max(0, 3 - hardOkCount);
          for (const p of players) tiebreak -= (lastRestCycle[p] ?? -1);
        }
        score -= hardViolations * 10000;
        const total = score + tiebreak * 0.001;
        if (total > bestScore) { bestScore = total; bestSizes = targetSizes; }
      }
      return bestSizes || Array.from({ length: N }, (_, i) => i >= N - k ? 5 : 4);
    }

    function computeNextCycle(eventData) {
      const lastCompletedCycleIndex = (eventData.previousCycles || []).length;
      const standings = computeStandings(eventData);

      const rs = getRestState(eventData);
      const restCounts = { ...rs.restCounts };
      const lastRestCycle = { ...rs.lastRestCycle };
      (eventData.courts || []).forEach(court => {

            lastRestCycle[round.resting] = lastCompletedCycleIndex;

        });

      const { lists: exchangedLists, moved } = boundaryExchangePlayers(eventData.courts, standings);
      const N = eventData.courts.length;
      const seed = {};
      eventData.courts.forEach((c, ci) => {
        [...c.players].sort((a, b) => (rankMap[a] ?? 999) - (rankMap[b] ?? 999)).forEach((p, i) => { seed[p] = ci * 1000 + i; });

      const targetSizes = determineTargetSizes(exchangedLists, N, seed, moved, restCounts, lastRestCycle, lastCompletedCycleIndex);
      const rebalanced = rebalanceCourtSizes(exchangedLists, targetSizes, seed, moved);
      const newCourts = rebalanced.map((players, i) => makeCourt(i, players, restCounts, lastRestCycle, lastCompletedCycleIndex));

    // Luokitus on koko tapahtuman pelitulosten pienimmän neliösumman/logistinen malli: jokaisella pelaajalla on taso,
    // pelin odotettu pistesuhde riippuu joukkueiden tasojen erotuksesta. Tasapeli = pistesuhde 0,5. Huomioi parit ja vastustajat.
    const RATING_K = 0.35, RATING_ITERS = 300, RATING_STEP = 0.8, RATING_LAMBDA = 0.02;
    const SEED_PRIOR_C = 0.5, SEED_PRIOR_LAMBDA = 0.5;

    function qnormApprox(p) {
      const a = [-39.69683028665376, 220.9460984245205, -275.9285104469687, 138.357751867269, -30.66479806614716, 2.506628277459239];
      const b = [-54.47609879822406, 161.5858368580409, -155.6989798598866, 66.80131188771972, -13.28068155288572];
      const c = [-0.007784894002430293, -0.3223964580411365, -2.400758277161838, -2.549732539343734, 4.374664141464968, 2.938163982698783];
      const d = [0.007784695709041462, 0.3224671290700398, 2.445134137142996, 3.754408661907416];
      const pl = 0.02425;
      if (p < pl) { const q = Math.sqrt(-2 * Math.log(p)); return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
      if (p > 1 - pl) { const q = Math.sqrt(-2 * Math.log(1 - p)); return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
      const q = p - 0.5, r = q * q;
      return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
    }

    // Aloitustaso (luokituksen yksikköinä). Alkujärjestys (vahvin ensin) muutetaan normaalijakauman kvantiileiksi.
    // seedByCourt: saman aloituskentän pelaajat saavat saman tason (kentän pelaajien keskiarvo), koska kentän sisäistä
    // paremmuutta ei alussa tiedetä. Kenttien välinen ero säilyy. Aloituskentät = ensimmäisen kierroksen kenttäjako.
    function startLevelMap(eventData) {
      const m = {};
      if (!eventData) return m;
      if (eventData.seedByCourt) {
        const first = (eventData.previousCycles || [])[0];
        const courts = ((first && first.courts) || eventData.courts || []).slice().sort((a, b) => a.courtNumber - b.courtNumber);
        const order = [];
        courts.forEach(c => (c.players || []).forEach(p => { if (!order.includes(p)) order.push(p); }));
        if (order.length < 2) return m;
        const q = i => SEED_PRIOR_C * qnormApprox(1 - (i + 0.5) / order.length);
        let i = 0;
        courts.forEach(c => {
          const ps = (c.players || []).filter(p => m[p] === undefined);
          if (!ps.length) return;
          let sum = 0;
          ps.forEach(() => { sum += q(i++); });
          ps.forEach(p => { m[p] = sum / ps.length; });
        });
        return m;
      }
      const order = eventData.seedOrder;
      if (!Array.isArray(order) || order.length < 2) return m;
      order.forEach((p, i) => { m[p] = SEED_PRIOR_C * qnormApprox(1 - (i + 0.5) / order.length); });
      return m;
    }

    // Aloitustaso kevyeksi lähtöarvoksi luokitukselle (ellei lähtötieto ole pois käytöstä)
    function seedPriorOf(eventData) {
      if (!eventData || eventData.useSeedPrior === false) return null;
      const pr = startLevelMap(eventData);
      return Object.keys(pr).length ? pr : null;
    }

    // Kaikki pelatut pelit: aiemmat kierrokset + käynnissä oleva (valinnaisesti vain erään maxRound asti)
    function collectGames(eventData, opts = {}) {
      const g = [];
      const add = (courts, rounds, maxRound, cycle) => {
        (rounds || []).forEach((round, rIdx) => {
          if (maxRound !== undefined && rIdx > maxRound) return;
          (courts || []).forEach(court => {
            const res = round && round.results && round.results[court.courtIndex];
            const pair = getRoundPairing(court, rIdx);
            if (!res || !pair) return;
            g.push({ t1: pair.team1 || [], t2: pair.team2 || [], a: Number(res.team1Score), b: Number(res.team2Score), cycle });
          });
        });
      };
      if (!opts.currentOnly) (eventData.previousCycles || []).forEach((c, i) => add(c.courts, c.rounds, undefined, i));
      add(eventData.courts, eventData.rounds, opts.maxRound, (eventData.previousCycles || []).length);
      return g;
    }

    function computeRatings(eventData, opts = {}) {
      const games = collectGames(eventData, opts);
      const names = new Set(eventData.playerNames || []);
      games.forEach(x => { x.t1.concat(x.t2).forEach(p => names.add(p)); });
      const prior = opts.noPrior ? null : seedPriorOf(eventData);
      const r = {}, pr = {};
      names.forEach(p => { pr[p] = prior && prior[p] !== undefined ? prior[p] : 0; r[p] = pr[p]; });
      if (!games.length) return r;
      const lam = prior ? SEED_PRIOR_LAMBDA : RATING_LAMBDA;
      for (let it = 0; it < RATING_ITERS; it++) {
        const gr = {};
        names.forEach(p => { gr[p] = -lam * (r[p] - pr[p]); });
        games.forEach(x => {
          const dd = x.t1.reduce((q, p) => q + (r[p] || 0), 0) - x.t2.reduce((q, p) => q + (r[p] || 0), 0);
          const tot = x.a + x.b;
          const y = tot > 0 ? x.a / tot : 0.5;
          const e = 1 / (1 + Math.exp(-RATING_K * dd));
          const er = y - e;
          x.t1.forEach(p => { gr[p] += er; }); x.t2.forEach(p => { gr[p] -= er; });
        });
        names.forEach(p => { r[p] += RATING_STEP * gr[p]; });
      }
      return r;
    }
    function ratingLabel(r) { return Math.round(1000 + 100 * (r || 0)); }

    function gameStats(games, names) {
      const st = {};
      names.forEach(p => { st[p] = { wins: 0, ties: 0, losses: 0, played: 0, pf: 0, pa: 0 }; });
      games.forEach(x => {
        const w1 = x.a > x.b ? 1 : (x.a === x.b ? 0.5 : 0);
        const upd = (team, sc, opp, w) => team.forEach(p => {
          if (!st[p]) st[p] = { wins: 0, ties: 0, losses: 0, played: 0, pf: 0, pa: 0 };
          const q = st[p]; q.played++; q.pf += sc; q.pa += opp;
          if (w === 1) q.wins++; else if (w === 0) q.losses++; else q.ties++;
        });
        upd(x.t1, x.a, x.b, w1); upd(x.t2, x.b, x.a, 1 - w1);
      });
      return st;
    }
    function statsRow(name, q, rating) {
      const tot = q.pf + q.pa;
      return {
        name, rating, wins: q.wins, ties: q.ties, losses: q.losses, played: q.played,
        winRate: q.played ? (q.wins + 0.5 * q.ties) / q.played : 0,
        share: tot > 0 ? q.pf / tot : 0.5,
        pointsFor: q.pf, pointsAgainst: q.pa,
        pointDiffSum: q.pf - q.pa,
        avgPointDiff: q.played ? (q.pf - q.pa) / q.played : 0
      };
    }
    function sortByRating(rows, order) {
      const idx = {}; (order || []).forEach((p, i) => { idx[p] = i; });
      rows.sort((a, b) => {
        if (Math.abs(b.rating - a.rating) > 1e-9) return b.rating - a.rating;
        if (Math.abs(b.winRate - a.winRate) > 1e-9) return b.winRate - a.winRate;
        if (Math.abs(b.share - a.share) > 1e-9) return b.share - a.share;
        return (idx[a.name] ?? 1e9) - (idx[b.name] ?? 1e9);
      });
      return rows;
    }

    // Käynnissä olevan kierroksen tilasto (V/T/H, pistesuhde) + luokitus koko tapahtumasta. Järjestys = luokitus.
    // Tämän järjestyksen perusteella ratkaistaan kenttäkohtaiset nousijat ja putoajat.
    function computeStandings(eventData) {
      const names = Array.from(new Set((eventData.playerNames || []).concat(
        (eventData.courts || []).flatMap(c => c.players || []))));
      const rating = computeRatings(eventData);
      const st = gameStats(collectGames(eventData, { currentOnly: true }), names);
      const rows = names.map(p => statsRow(p, st[p] || { wins: 0, ties: 0, losses: 0, played: 0, pf: 0, pa: 0 }, rating[p] || 0));
      return sortByRating(rows, eventData.playerNames);
    }

    // Koko tapahtuman tilasto kentittäin (live). upToEräIdx: lasketaan vain tämän erän asti (erä-kohtainen kehitys).
    function computeEventStandingsByCourt(eventData, upToEräIdx) {
      const names = Array.from(new Set((eventData.playerNames || []).concat(
        (eventData.courts || []).flatMap(c => c.players || []))));
      const opts = upToEräIdx !== undefined ? { maxRound: upToEräIdx } : {};
      const rating = computeRatings(eventData, opts);
      const st = gameStats(collectGames(eventData, opts), names);
      const courtOf = {};
      (eventData.courts || []).forEach(c => (c.players || []).forEach(p => { courtOf[p] = c.courtNumber; }));
      const byCourt = {};
      names.forEach(p => {
        const cNum = courtOf[p] || 999;
        (byCourt[cNum] = byCourt[cNum] || []).push(Object.assign(
          statsRow(p, st[p] || { wins: 0, ties: 0, losses: 0, played: 0, pf: 0, pa: 0 }, rating[p] || 0), { court: cNum }));
      });
      Object.keys(byCourt).forEach(k => sortByRating(byCourt[k], eventData.playerNames));
      return byCourt;
    }

    // Koko tapahtuman yleisluokitus (kaikki pelaajat, paras ensin)
    function computeOverallStandings(eventData) {
      const names = Array.from(new Set((eventData.playerNames || []).concat(
        (eventData.courts || []).flatMap(c => c.players || []))));
      const rating = computeRatings(eventData);
      const st = gameStats(collectGames(eventData), names);
      const courtOf = {};
      (eventData.courts || []).forEach(c => (c.players || []).forEach(p => { courtOf[p] = c.courtNumber; }));
      const rows = names.map(p => Object.assign(statsRow(p, st[p], rating[p] || 0), { court: courtOf[p] || null }));
      return sortByRating(rows, eventData.playerNames);
    }

    // Ennustettu siirto: nimi -> kenttänumero seuraavalla kierroksella (null jos ei vielä tuloksia)
    function projectedCourtMap(eventData) {
      if (!eventData || !eventData.courts || !eventData.courts.length) return null;
      const any = (eventData.rounds || []).some(r => r && r.results && Object.keys(r.results).length > 0);
      if (!any) return null;
      try {
        const { courts } = computeNextCycle(eventData);
        const m = {};
        courts.forEach(c => c.players.forEach(p => { m[p] = c.courtNumber; }));
        return m;
      } catch (e) { return null; }
    }

    // Pelaajan taukojen lukumäärä: päättyneet kierrokset + käynnissä olevan kierroksen jo pelatut erät
    function computeRestCountsLive(eventData) {
      const rc = {};
      (eventData.previousCycles || []).forEach(c => (c.courts || []).forEach(court => (court.rounds || []).forEach(r => {
        if (r && r.resting) rc[r.resting] = (rc[r.resting] || 0) + 1;
      })));
      (eventData.courts || []).forEach(court => (court.rounds || []).forEach((r, rIdx) => {
        if (r && r.resting && eventData.rounds && eventData.rounds[rIdx] && eventData.rounds[rIdx].results && eventData.rounds[rIdx].results[court.courtIndex]) rc[r.resting] = (rc[r.resting] || 0) + 1;
      }));
      return rc;
    }
    // Aloitustaso näytettäväksi, vaikka lähtötieto ei olisi käytössä luokituksessa
    function seedRatingMap(eventData) { return startLevelMap(eventData); }

    function recordStr(s) {
      if (s.ties === undefined && s.losses === undefined) return `${s.wins}/${s.played}`;
      return `${s.wins}–${s.ties || 0}–${s.losses || 0}`;
    }

    function computePlacementProgression(eventData) {
      const { playerNames } = eventData;
      const result = {};
      (playerNames || []).forEach(p => { result[p] = [null, null, null]; });
      for (let eräIdx = 0; eräIdx < 3; eräIdx++) {
        if (!hasAnyEräResults(eventData, eräIdx)) continue;
        const byCourt = computeEventStandingsByCourt(eventData, eräIdx);
        Object.values(byCourt).forEach(courtPlayers => {
          if (!Array.isArray(courtPlayers)) return;
          courtPlayers.forEach((s, i) => { if (result[s.name]) result[s.name][eräIdx] = i + 1; });
        });
      }
      return result;
    }

    function hasAnyEräResults(eventData, eräIdx) {
      const round = eventData?.rounds?.[eräIdx];
      if (!round?.results) return false;
      return Object.keys(round.results).length > 0;
    }

    function isCycleComplete(eventData) {
      if (!eventData || !eventData.rounds || !eventData.courts) return false;
      if (eventData.courts.length === 0) return false;
      for (let r = 0; r < 3; r++) {
        const round = eventData.rounds[r];
        if (!round || !round.results) return false;
        for (const court of eventData.courts) {
          if (!round.results[court.courtIndex]) return false;
        }
      }
      return true;
    }

    function computeRoundStatus(data) {
      if (!data || !data.courts || !data.rounds) return { totalEntered: 0, total: 0, currentRound: 1, completed: false, hasAny: false };
      const numCourts = data.courts.length;
      const total = 3 * numCourts;
      let totalEntered = 0, currentRound = 3, completed = true;
      for (let r = 0; r < 3; r++) {
        let roundEntered = 0;
        for (const court of data.courts) {
          if (data.rounds[r]?.results?.[court.courtIndex]) { roundEntered++; totalEntered++; }
        }
        if (roundEntered < numCourts) { if (completed) currentRound = r + 1; completed = false; }
      }
      return { totalEntered, total, currentRound, completed, hasAny: totalEntered > 0 };
    }

    // ---------- Paikallinen tietokanta (localStorage) ----------
    // Jäljittelee Firebase Realtime Databasen käyttäytymistä: tyhjät objektit/taulukot
    // katoavat, kielletyt avaimet aiheuttavat virheen, numeroavaimiset objektit palaavat taulukoina.
    function createLocalBackend() {
      const KEY = 'APPL_localdb';
      const LOCAL_UID = 'local-user';
      const listeners = new Set();
      const BAD_KEY = /[.$#\[\]\/]/;
      // Serialisoi luku-muokkaus-kirjoitus -kierrokset välilehtien välillä (kuten Firebasen atomiset kirjoitukset)
      const withLock = (fn) => (typeof navigator !== 'undefined' && navigator.locks && window.isSecureContext)
        ? navigator.locks.request('APPL_localdb_lock', async () => fn())
        : Promise.resolve().then(fn);
      const delay = () => LOCAL_LATENCY > 0 ? new Promise(r => setTimeout(r, LOCAL_LATENCY)) : null;

      function readDb() { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : {}; } catch (e) { return {}; } }
      function writeDb(db) { localStorage.setItem(KEY, JSON.stringify(db)); }
      function parts(path) { return String(path || '').split('/').filter(Boolean); }
      function getAt(root, p) {
        let cur = root;
        for (const k of p) { if (cur == null || typeof cur !== 'object') return undefined; cur = cur[k]; }
        return cur;
      }
      function clean(v) {
        if (v === undefined || v === null) return undefined;
        if (typeof v === 'number' && !isFinite(v)) return undefined;
        if (Array.isArray(v)) { const out = v.map(clean); return out.every(x => x === undefined) ? undefined : out; }
        if (typeof v === 'object') {
          const out = {}; let any = false;
          for (const k of Object.keys(v)) {
            if (k === '' || BAD_KEY.test(k)) throw new Error(`Firebase: virheellinen avain "${k}"`);
            const c = clean(v[k]);
            if (c !== undefined) { out[k] = c; any = true; }
          }
          return any ? out : undefined;
        }
        return v;
      }
      function setIn(node, p, val) {
        if (p.length === 0) return val;
        const [k, ...rest] = p;
        const base = (node && typeof node === 'object') ? (Array.isArray(node) ? node.slice() : { ...node }) : {};
        const child = setIn(base[k], rest, val);
        if (child === undefined) { if (Array.isArray(base)) base[k] = undefined; else delete base[k]; }
        else base[k] = child;
        return clean(base);
      }
      function norm(v) {
        if (v === null || typeof v !== 'object') return v;
        if (Array.isArray(v)) return v.map(x => (x === undefined || x === null) ? null : norm(x));
        const keys = Object.keys(v);
        const out = {};
        keys.forEach(k => { out[k] = norm(v[k]); });
        if (keys.length && keys.every(k => /^(0|[1-9]\d*)$/.test(k))) {
          const max = Math.max(...keys.map(Number));
          if (max < keys.length * 2) {
            const arr = [];
            for (let i = 0; i <= max; i++) arr.push(String(i) in out ? out[String(i)] : null);
            return arr;
          }
        }
        return out;
      }
      function readNorm(path) {
        const raw = getAt(readDb(), parts(path));
        return raw === undefined ? null : norm(raw);
      }
      function notify() { [...listeners].forEach(l => l.check(false)); }

      if (typeof window !== 'undefined' && window.addEventListener) {
        window.addEventListener('storage', (e) => { if (e.key === KEY) notify(); });
      }

      return {
        mode: 'local',
        async ensureAuth() { return LOCAL_UID; },
        async reauth() {},
        uid() { return LOCAL_UID; },
        async get(path) { const w = delay(); if (w) await w; return JSON.parse(JSON.stringify(readNorm(path))); },
        async set(path, val) {
          const w = delay(); if (w) await w;
          return withLock(() => {
            const nd = setIn(readDb(), parts(path), clean(val));
            writeDb(nd || {}); notify();
          });
        },
        async update(path, obj) {
          const w = delay(); if (w) await w;
          return withLock(() => {
            let db = readDb();
            for (const [k, v] of Object.entries(obj)) {
              db = setIn(db, [...parts(path), ...parts(k)], clean(v)) || {};
            }
            writeDb(db); notify();
          });
        },
        async remove(path) {
          const w = delay(); if (w) await w;
          return withLock(() => {
            const nd = setIn(readDb(), parts(path), undefined);
            writeDb(nd || {}); notify();
          });
        },
        listen(path, cb) {
          const l = { active: true, last: undefined };
          l.check = (force) => {
            if (!l.active) return;
            const s = JSON.stringify(readNorm(path));
            if (force || s !== l.last) {
              l.last = s;
              try { cb(JSON.parse(s)); } catch (e) { console.error('Kuuntelija epäonnistui', e); }
            }
          };
          listeners.add(l);
          setTimeout(() => l.check(true), 0);
          return () => { l.active = false; listeners.delete(l); };
        },
        onConnection(cb) { cb(true); },
        _reset() { localStorage.removeItem(KEY); notify(); }
      };
    }
    // Pelaajan nimen vaihto. Palauttaa muuttuvat juuritason kentät (backend.update-muodossa): nimi vaihdetaan
    // kentistä, eristä, lepovuoroista, historiasta, sijoituksista, aloitusjärjestyksestä ja lepolaskureista.
    // nameChanges (vanha → uusi) kertoo muille laitteille, että niiden valitsema nimi on vaihtunut.
    function renamePlayerFields(ev, oldName, newName) {
      const KEYED = { restCounts: 1, lastRestCycle: 1 };
      const SKIP = { name: 1, playerCode: 1, createdAt: 1, status: 1, organizerCode: 1, nameChanges: 1, useSeedPrior: 1, seedByCourt: 1 };
      const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
      const walk = (v) => {
        if (typeof v === 'string') return v === oldName ? newName : v;
        if (Array.isArray(v)) return v.map(walk);
        if (v && typeof v === 'object') { const r = {}; Object.keys(v).forEach(k => { r[k] = walk(v[k]); }); return r; }
        return v;
      };
      const out = {};
      Object.keys(ev || {}).forEach(k => {
        if (own(SKIP, k)) return;
        if (own(KEYED, k)) {
          const m = decodeMap(ev[k]);
          if (!own(m, oldName)) return;
          m[newName] = m[oldName]; delete m[oldName];
          out[k] = encodeMap(m);
          return;
        }
        const nv = walk(ev[k]);
        if (JSON.stringify(nv) !== JSON.stringify(ev[k])) out[k] = nv;
      });
      const nc = decodeMap(ev && ev.nameChanges);
      Object.keys(nc).forEach(k => { if (nc[k] === oldName) nc[k] = newName; });
      nc[oldName] = newName;
      delete nc[newName];
      out.nameChanges = encodeMap(nc);
      return out;
    }
    // Seuraa nimenvaihtoja (nameChanges) nykyiseen nimeen; null jos nimeä ei enää ole.
    function resolveRenamedPlayer(ev, name) {
      const names = (ev && ev.playerNames) || [];
      const nc = decodeMap(ev && ev.nameChanges);
      let n = name;
      for (let i = 0; i < 20 && n && !names.includes(n); i++) n = Object.prototype.hasOwnProperty.call(nc, n) ? nc[n] : null;
      return n && names.includes(n) ? n : null;
    }
    // ==== PURE-LOGIC-END

    // ---------- Firebase-tietokanta (ladataan vain tuotantotilassa) ----------
    function createFirebaseBackend() {
      let M = null;
      async function load() {
        if (M) return M;
        const [appM, dbM, authM] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"),
          import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js")
        ]);
        const app = appM.initializeApp(firebaseConfig);
        M = { dbM, authM, db: dbM.getDatabase(app), auth: authM.getAuth(app) };
        return M;
      }
      const refOf = (m, path) => path ? m.dbM.ref(m.db, path) : m.dbM.ref(m.db);
      return {
        mode: 'firebase',
        async ensureAuth() {
          const m = await load();
          if (m.auth.currentUser) return m.auth.currentUser.uid;
          return new Promise((resolve, reject) => {
            let resolved = false;
            const unsub = m.authM.onAuthStateChanged(m.auth, (user) => { if (user && !resolved) { resolved = true; unsub(); resolve(user.uid); } });
            m.authM.signInAnonymously(m.auth).catch((error) => { if (!resolved) { resolved = true; unsub(); reject(error); } });
          });
        },
        async reauth() {
          const m = await load();
          if (m.auth.currentUser) { try { await m.auth.currentUser.getIdToken(true); return; } catch (_) {} }
          await m.authM.signInAnonymously(m.auth);
        },
        uid() { return M && M.auth.currentUser ? M.auth.currentUser.uid : null; },
        async get(path) { const m = await load(); const s = await m.dbM.get(refOf(m, path)); return s.exists() ? s.val() : null; },
        async set(path, val) { const m = await load(); return m.dbM.set(refOf(m, path), val); },
        async update(path, obj) { const m = await load(); return m.dbM.update(refOf(m, path), obj); },
        async remove(path) { const m = await load(); return m.dbM.remove(refOf(m, path)); },
        onConnection(cb) {
          load().then(m => m.dbM.onValue(m.dbM.ref(m.db, '.info/connected'), (s) => cb(!!s.val()))).catch(() => {});
        },
        listen(path, cb, errCb) {
          let unsub = null, cancelled = false;
          load().then(m => {

    function isPermissionError(e) {
      if (!e) return false;
      const code = String(e.code || '').toUpperCase();
      const msg = String(e.message || '').toLowerCase();
      return code.includes('PERMISSION') || msg.includes('permission_denied') || msg.includes('permission denied');
    }
    function isTimeoutError(e) { return !!(e && e.message && e.message.indexOf('Aikakatkaisu') === 0); }

    function withTimeout(promise, timeoutMs = OP_TIMEOUT_MS, isWrite = false) {
      return new Promise((resolve, reject) => {
        let settled = false;
        const timer = setTimeout(() => {
          if (!settled) {
            settled = true;
            reject(new Error(isWrite
              ? 'Aikakatkaisu – tallennus voi silti onnistua, kun yhteys palaa. Tarkista tilanne ennen kuin yrität uudelleen.'
              : 'Aikakatkaisu – yhteys ei vastaa. Tarkista verkkoyhteys ja yritä uudelleen.'));
          }
        }, timeoutMs);
        Promise.resolve(promise).then(
          (v) => { if (!settled) { settled = true; clearTimeout(timer); resolve(v); } },
          (e) => { if (!settled) { settled = true; clearTimeout(timer); reject(e); } }
        );
      });
    }

    async function withAuthRetry(fn, opts = {}) {
      const { write = false, timeoutMs = OP_TIMEOUT_MS } = opts;
      try {
        return await withTimeout(Promise.resolve().then(fn), timeoutMs, write);
      } catch (e) {
        if (isPermissionError(e) || (!write && isTimeoutError(e))) {
          try { await backend.reauth(); } catch (_) {}
          return await withTimeout(Promise.resolve().then(fn), timeoutMs, write);
        }
        throw e;
      }
    }

      t.setAttribute('role', type === 'error' ? 'alert' : 'status');
      const m = document.createElement('span');
      m.textContent = msg;
      t.appendChild(m);
      const close = () => { if (t.parentNode) t.remove(); };
      if (opts.action) {

        b.type = 'button';
        b.textContent = opts.action.label;
        b.onclick = () => { close(); opts.action.fn(); };
        t.appendChild(b);
      }
      host.appendChild(t);
      while (host.children.length > 3) host.firstChild.remove();
      setTimeout(close, opts.ms || (type === 'error' ? 5000 : (opts.action ? 6000 : 2200)));
